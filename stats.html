<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- S-280: self-only; vercel.json repeats it as a header with frame-ancestors (a meta CSP cannot set that) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Life in UK · 使用統計</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
/* v2.9.0 owner dashboard (mockup: mockups/v2.9.0/stats-dashboard.html).
   Layout: navy app bar (range chips) → "since launch" strip → 4 period tiles → two full-width charts → scroll-panel table;
   one column on phones. 7 / 30 / 90 days read per day; 1 year / all time read per month.
   Tokens follow the app's own (css/base/tokens.css): navy bar, #f0f2f7 page, white cards; chart hues validated
   with the dataviz palette validator (light on #fff, dark on #1a2744). */
:root {
  --bg: #f0f2f7;
  --card: #ffffff;
  --text: #1a2744;
  --text-muted: #5a6a8a;
  --border: #dde2f0;
  --grid: #e8ebf4;
  --bar: #1a2744;
  --bar-text: #ffffff;
  --bar-muted: rgba(255,255,255,0.6);
  --bar-line: rgba(255,255,255,0.25);
  --chip-bg: rgba(255,255,255,0.1);
  --chip-on-bg: #ffffff;
  --chip-on-text: #1a2744;
  --series-1: #3d5bc4;   /* browser opens / active devices */
  --series-2: #b8892a;   /* installed-app opens */
  --up: #2d6a4f;
  --down: #922b21;
  --note-bg: #fdf6e3;
  --strip-bg: #e6ebf8;
  --focus: #3d5bc4;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang HK', 'Noto Sans HK', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a2e; --card: #1a2744; --text: #e8ecf6; --text-muted: #9aa8c7; --border: #2e3d63; --grid: #26355a;
  --bar: #0c1424; --chip-on-bg: #e8ecf6; --chip-on-text: #1a2744;
  --series-1: #6a88ea; --series-2: #b5862a;
  --up: #52b788; --down: #e88a80; --note-bg: #2a2a1e; --strip-bg: #21305a; --focus: #6a88ea;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111a2e; --card: #1a2744; --text: #e8ecf6; --text-muted: #9aa8c7; --border: #2e3d63; --grid: #26355a;
  --bar: #0c1424; --chip-on-bg: #e8ecf6; --chip-on-text: #1a2744;
  --series-1: #6a88ea; --series-2: #b5862a;
  --up: #52b788; --down: #e88a80; --note-bg: #2a2a1e; --strip-bg: #21305a; --focus: #6a88ea;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, .table-wrap:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* app bar */
.appbar { background: var(--bar); color: var(--bar-text); }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font-size: 17px; letter-spacing: 0.01em; }
.brand span { color: var(--bar-muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--chip-bg); color: var(--bar-text); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-text); font-weight: 600; }
.tools { display: flex; gap: 8px; }
.ghost { border: 1px solid var(--bar-line); background: transparent; color: var(--bar-text); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
.lang { min-width: 48px; }

main { display: grid; gap: 16px; padding-block: 18px 40px; }
.load-error { background: var(--note-bg); color: var(--down); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.loading { text-align: center; color: var(--text-muted); padding-block: 80px; }
.primary:disabled { opacity: 0.6; cursor: progress; }

/* since-launch strip: running totals that ignore the range chips */
.strip { background: var(--strip-bg); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; }
.strip h2 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 0; letter-spacing: 0.02em; flex-basis: 100%; }
.strip div { display: flex; align-items: baseline; gap: 8px; }
.strip dt { font-size: 13px; color: var(--text-muted); }
.strip dd { margin: 0; font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
.strip dl { display: contents; }

/* period tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.tile .label { color: var(--text-muted); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .delta { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.delta .up { color: var(--up); font-weight: 600; }
.delta .down { color: var(--down); font-weight: 600; }

/* chart cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 8px; }
.card h2 { font-size: 15.5px; margin: 0; text-wrap: balance; }
.card .sub { color: var(--text-muted); font-size: 12.5px; margin: 2px 0 0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.chart { position: relative; min-height: 220px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.chart .end-label { fill: var(--text); font-weight: 600; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--card); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); font-variant-numeric: tabular-nums; z-index: 2; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* table: its own scroll panel; the header row stays put while the rows scroll */
.table-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--grid); border-radius: 8px; overscroll-behavior: contain; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
thead th { position: sticky; top: 0; background: var(--card); z-index: 1; box-shadow: inset 0 -1px 0 var(--grid); }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 600; font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
td.zero { color: var(--text-muted); }

/* sign-in state */
.signin { max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: grid; gap: 12px; }
.signin h2 { margin: 0; font-size: 18px; }
.signin p { margin: 0; color: var(--text-muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.signin label { font-size: 13px; font-weight: 600; }
.signin input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
.primary { border: 0; background: var(--bar); color: var(--bar-text); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.error { color: var(--down); font-size: 13px; }

@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .value { font-size: 24px; } }
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="brand"><b data-i18n="title"></b><span data-i18n="subtitle"></span></div>
    <div class="chips signed-in" role="group" data-i18n-aria="range" id="rangeChips" hidden>
      <button class="chip" type="button" data-range="7" aria-pressed="false"></button>
      <button class="chip" type="button" data-range="30" aria-pressed="true"></button>
      <button class="chip" type="button" data-range="90" aria-pressed="false"></button>
      <button class="chip" type="button" data-range="365" aria-pressed="false"></button>
      <button class="chip" type="button" data-range="all" aria-pressed="false"></button>
    </div>
    <div class="tools">
      <button class="ghost lang" id="langBtn" type="button"></button>
      <button class="ghost signed-in" id="refreshBtn" type="button" data-i18n="refresh" hidden></button>
      <button class="ghost signed-in" id="signOutBtn" type="button" data-i18n="signOut" hidden></button>
    </div>
  </div>
</header>

<div class="wrap">
  <p class="loading" id="loading" data-i18n="loading" hidden></p>

  <main id="dash" hidden>
    <p class="load-error" id="loadError" role="alert" hidden></p>

    <section class="strip" aria-labelledby="stripTitle">
      <h2 id="stripTitle"></h2>
      <dl>
        <div><dt data-i18n="lifeOpens"></dt><dd id="lOpen"></dd></div>
        <div><dt data-i18n="lifeInstalls"></dt><dd id="lInstall"></dd></div>
        <div><dt data-i18n="lifeShare"></dt><dd id="lShare"></dd></div>
        <div><dt data-i18n="lifeDays"></dt><dd id="lDays"></dd></div>
      </dl>
    </section>

    <section class="tiles" data-i18n-aria="summary">
      <div class="tile"><span class="label" data-i18n="tileOpen"></span><span class="value" id="tOpen"></span><span class="delta" id="dOpen"></span></div>
      <div class="tile"><span class="label" data-i18n="tileDau"></span><span class="value" id="tDau"></span><span class="delta" id="dDau"></span></div>
      <div class="tile"><span class="label" data-i18n="tileInstall"></span><span class="value" id="tInstall"></span><span class="delta" id="dInstall"></span></div>
      <div class="tile"><span class="label" data-i18n="tileShare"></span><span class="value" id="tShare"></span><span class="delta" id="dShare"></span></div>
    </section>

    <section class="card">
      <div class="card-head"><div><h2 id="dauTitle"></h2><p class="sub" id="dauSub"></p></div></div>
      <div class="chart" id="dauChart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2 id="openTitle"></h2><p class="sub" data-i18n="openSub"></p></div>
        <div class="legend"><span><i style="background: var(--series-1)"></i><span data-i18n="browserOpens"></span></span><span><i style="background: var(--series-2)"></i><span data-i18n="appOpens"></span></span></div>
      </div>
      <div class="chart" id="openChart"></div>
    </section>

    <section class="card">
      <div class="card-head"><div><h2 id="tableTitle"></h2><p class="sub" data-i18n="tableSub"></p></div></div>
      <div class="table-wrap" tabindex="0" id="tablePanel">
        <table>
          <thead><tr><th id="colPeriod"></th><th data-i18n="colOpen"></th><th data-i18n="colBrowser"></th><th data-i18n="colApp"></th><th id="colDau"></th><th data-i18n="colInstall"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <form class="signin" id="signin" hidden>
    <h2 data-i18n="signInTitle"></h2>
    <p data-i18n="signInHint"></p>
    <div class="field">
      <label for="userInput" data-i18n="username"></label>
      <input id="userInput" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="pwdInput" data-i18n="password"></label>
      <input id="pwdInput" type="password" autocomplete="current-password" required>
    </div>
    <span class="error" id="signinError" role="alert"></span>
    <button class="primary" type="submit" id="signInBtn" data-i18n="signIn"></button>
  </form>
</div>

<script src="locales/stats.js"></script>
<script src="js/stats/statsModel.js"></script>
<script src="js/stats/statsPage.js"></script>
</body>
</html>
