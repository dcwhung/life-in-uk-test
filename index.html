<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2744">
<meta name="description" content="Life in the UK Test — Exam 1–17 Practice App">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life in UK">
<title>Life in the UK · Exam Practice</title>
<link rel="stylesheet" href="css/base/tokens.css">
<link rel="stylesheet" href="css/base/layout.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/chips.css">
<link rel="stylesheet" href="css/components/dots.css">
<link rel="stylesheet" href="css/components/modal.css">
<link rel="stylesheet" href="css/components/popover.css">
<link rel="stylesheet" href="css/screens/home.css">
<link rel="stylesheet" href="css/screens/quiz.css">
<link rel="stylesheet" href="css/screens/results.css">
<link rel="stylesheet" href="css/screens/flagged.css">
<link rel="stylesheet" href="css/screens/study.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-flag">🇬🇧</span>
      <div>
        <div class="logo-text"><span data-i18n="app.name"></span> <button class="info-btn" id="infoBtn" data-i18n-attr="aria-label:app.about" aria-expanded="false" data-action="toggleInfo">ⓘ</button></div>
        <div class="logo-sub"><span data-i18n="app.sub"></span> <span class="app-version" id="appVersion"></span></div>
      </div>
    </div>
  </div>
  <div class="info-pop" id="infoPop" role="dialog" data-i18n-attr="aria-label:app.about">
    <h2><span id="infoTitle"></span> <span class="app-version" id="appVersionPop"></span></h2>
    <p id="infoIntro"></p>
    <div class="hero-meta">
      <div class="hero-badge" id="infoExamCount"></div>
      <div class="hero-badge" id="infoQuestionCount"></div>
      <div class="hero-badge" data-i18n="app.infoOffline"></div>
    </div>
  </div>
</header>

<main>

  <!-- ── HOME ── -->
  <div class="screen active" id="screenHome">

    <div class="install-banner" id="installBanner">
      <div class="install-text">
        <strong data-i18n="app.installTitle"></strong>
        <span data-i18n="app.installText"></span>
      </div>
      <button class="install-btn" id="installBtn" data-action="install" data-i18n="app.installButton"></button>
    </div>

    <div class="section-title" data-i18n="home.chooseMode"></div>
    <div class="mode-grid">
      <button class="mode-card" id="modeStudy" data-action="openStudy">
        <div class="mode-icon">📖</div>
        <div class="mode-title" data-i18n="home.modeStudy"></div>
      </button>
      <button class="mode-card" id="modePractice" data-action="startMode" data-arg="practice">
        <div class="mode-icon">🎯</div>
        <div class="mode-title" data-i18n="home.modePractice"></div>
      </button>
      <button class="mode-card" id="modeExam" data-action="startMode" data-arg="exam">
        <div class="mode-icon">📝</div>
        <div class="mode-title" data-i18n="home.modeExam"></div>
      </button>
    </div>
    <div class="mode-desc-panel" id="modeDesc"></div>

    <!-- practice: sets built from what the user has done (shown once there is something in them) -->
    <div class="my-review" id="myReview">
      <div class="section-title" data-i18n="home.myReview"></div>
      <div class="my-grid">
        <button class="my-tile wrong" id="tileWrong" data-action="startWrongReview"></button>
        <button class="my-tile flagged" id="tileFlagged" data-action="openFlagged"></button>
      </div>
      <div class="my-note" id="myReviewNote"></div>
    </div>

    <!-- practice: the questions' own categories -->
    <div class="section-title practice-by-title" id="practiceByTitle" data-i18n="home.practiceBy"></div>
    <div class="practice-tabs" id="practiceTabs">
      <button class="practice-tab" id="ptabDifficulty" data-action="setPracticeView" data-arg="difficulty" data-i18n="home.tabDifficulty"></button>
      <button class="practice-tab" id="ptabChapter" data-action="setPracticeView" data-arg="chapter" data-i18n="home.tabChapter"></button>
      <button class="practice-tab" id="ptabExam" data-action="setPracticeView" data-arg="exam" data-i18n="home.tabExam"></button>
    </div>

    <div class="exam-select-section" id="secDifficulty">
      <div class="diff-grid" id="diffGrid"></div>
    </div>

    <div class="exam-select-section" id="secChapter">
      <div class="chapter-grid" id="chapterGrid"></div>
    </div>

    <div class="exam-select-section" id="secExam">
      <div class="section-title" id="secExamTitle" data-i18n="home.selectExam"></div>
      <div class="exam-grid" id="examGrid"></div>
    </div>

    <div class="reset-row" id="practiceReset">
      <span class="reset-hint" id="practiceHint"></span>
      <button class="reset-btn" data-action="resetPracticeProgress" data-i18n="home.resetProgress"></button>
    </div>
    <div class="reset-row" id="examReset">
      <span class="reset-hint" data-i18n="home.examResetHint"></span>
      <button class="reset-btn" data-action="resetCompletedExams" data-i18n="home.resetCompleted"></button>
    </div>

  </div>

  <!-- ── FLAGGED (practice) ── -->
  <div class="screen" id="screenFlagged">
    <div class="quiz-header">
      <button class="back-btn" data-action="goHome" data-i18n="common.home"></button>
      <span class="quiz-label" data-i18n="flagged.title"></span>
    </div>
    <button class="flag-start" id="flaggedStart" data-action="startFlaggedPractice"></button>
    <div id="flaggedList"></div>
  </div>

  <!-- ── STUDY ── -->
  <div class="screen" id="screenStudy">
    <div class="quiz-header">
      <button class="back-btn" data-action="goHome" data-i18n="common.home"></button>
      <span class="quiz-label" data-i18n="study.title"></span>
    </div>

    <input class="study-search" id="studySearch" type="search" data-i18n-attr="placeholder:study.search" data-input-action="studySetSearch">

    <div class="study-tabs" id="studyTabs">
      <button class="study-tab" data-tab="chapters" data-action="studySetTab" data-arg="chapters" data-i18n="study.tabChapters"></button>
      <button class="study-tab" data-tab="timeline" data-action="studySetTab" data-arg="timeline" data-i18n="study.tabTimeline"></button>
      <button class="study-tab" data-tab="geo" data-action="studySetTab" data-arg="geo" data-i18n="study.tabGeo"></button>
      <button class="study-tab" data-tab="people" data-action="studySetTab" data-arg="people" data-i18n="study.tabPeople"></button>
    </div>

    <div class="chip-row" id="studyChips"></div>
    <div class="chip-row" id="studySubChips" hidden></div>
    <div class="study-count" id="studyCount"></div>
    <div id="studyContent"></div>
  </div>

  <!-- ── QUIZ ── -->
  <div class="screen" id="screenQuiz">
    <div class="quiz-header">
      <button class="back-btn" data-action="goHome" data-i18n="common.home"></button>
      <div class="quiz-meta">
        <span class="quiz-label" id="quizLabel"></span>
        <span class="quiz-mode-badge" id="modeBadge"></span>
        <span class="exam-timer" id="examTimer" role="timer" aria-live="off" hidden></span>
      </div>
    </div>

    <div class="round-row" id="roundRow" hidden><span class="round-note" id="roundNote"></span></div>
    <div class="q-card">
      <div class="q-progress"><div class="q-progress-fill" id="progressFill" style="width:0%"></div></div>
      <!-- question navigator (tap a number to jump) + answered / unanswered / flagged counts -->
      <div class="nav-dots" id="navDots" hidden></div>
      <div class="dots-meta" id="dotsMeta" hidden></div>
      <div class="q-num">
        <span class="q-num-text" id="qNum"></span>
        <!-- bookmark icon filled in from bookmarkSvg() at init (single source for the path) -->
        <button class="flag-btn" id="flagBtn" data-action="toggleFlag" hidden></button>
        <button class="yue-toggle" id="yueToggle" data-action="toggleQuestionYue"></button>
        <!-- once answered: quick Prev / Next in the Translate spot (mirrors the bottom buttons) -->
        <span class="quick-nav" id="quickNav">
          <button class="quick-btn" id="quickPrev" data-i18n-attr="title:quiz.previous;aria-label:quiz.previous" data-action="prevQ">←</button>
          <button class="quick-btn primary" id="quickNext" data-action="next">→</button>
        </span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="q-yue" id="qYue"></div>
    </div>

    <div class="options" id="optionsContainer"></div>

    <!-- practice: show after selection -->
    <div class="answer-box" id="answerBox">
      <div class="ans-label" id="ansLabel"></div>
      <div class="ans-en" id="ansEn"></div>
      <div class="divider"></div>
      <div class="ans-yue" id="ansYue"></div>
      <div class="ans-note" id="ansNote"></div>
    </div>


    <div class="nav-row">
      <button class="nav-btn secondary" id="prevBtn" data-action="prevQ" data-i18n="quiz.prevButton"></button>
      <button class="nav-btn" id="nextBtn" data-action="next"></button>
    </div>

    <!-- practice: other questions built from the same study fact (below Prev / Next) -->
    <div class="sqm" id="similarBox"></div>
  </div>

  <!-- ── RESULT ── -->
  <div class="screen" id="screenResult">
    <div class="quiz-header">
      <button class="back-btn" data-action="goHome" data-i18n="common.home"></button>
      <span class="quiz-label" id="resultLabel"></span>
    </div>

    <div class="result-timeup" id="resultTimeUp" hidden data-i18n="exam.timeUp"></div>
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-label" id="resultLabel2"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-note" id="resultNote"></div>
      <!-- one dot per question (green correct · red wrong · red outline unanswered · orange ring flagged) -->
      <div class="rdots-wrap" id="resultDotsWrap" hidden>
        <div class="rdots" id="resultDots"></div>
        <div class="rmeta" id="resultDotsMeta"></div>
      </div>
    </div>

    <div class="section-title" data-i18n="result.byDifficulty"></div>
    <div class="diff-table" id="diffTable"></div>

    <!-- same buttons above and below the review list, so a long review needs no scrolling -->
    <div class="nav-row result-actions">
      <button class="nav-btn secondary retry-btn" data-action="retryExam"></button>
      <button class="nav-btn another-btn" data-action="goHome"></button>
    </div>

    <div class="section-title" data-i18n="result.reviewAnswers"></div>
    <div class="chip-row" id="reviewOrder"></div>
    <div class="review-list" id="reviewList"></div>

    <div class="nav-row">
      <button class="nav-btn secondary retry-btn" data-action="retryExam"></button>
      <button class="nav-btn another-btn" data-action="goHome"></button>
    </div>
  </div>

</main>

<!-- in-app confirm modal -->
<div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" data-action="confirmBackdrop">
  <div class="modal-card">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-msg" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="nav-btn secondary" id="confirmCancel" data-action="closeConfirm"></button>
      <button class="nav-btn" id="confirmOk" data-action="confirmAccept"></button>
    </div>
  </div>
</div>
<!-- load order: data → config → utils → locales → i18n → store → domain → components → screens → actions → pwa → main (classic scripts, shared globals) -->
<script src="data/exams.js"></script>
<script src="data/study.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/utils.js"></script>
<script src="locales/en.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/store.js"></script>
<script src="js/domain/questions.js"></script>
<script src="js/domain/mastery.js"></script>
<script src="js/domain/similar.js"></script>
<script src="js/components/icons.js"></script>
<script src="js/components/dots.js"></script>
<script src="js/components/tags.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/popover.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/quiz.js"></script>
<script src="js/screens/examTools.js"></script>
<script src="js/screens/similarPanel.js"></script>
<script src="js/screens/result.js"></script>
<script src="js/screens/flagged.js"></script>
<script src="js/screens/study.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/pwa/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
