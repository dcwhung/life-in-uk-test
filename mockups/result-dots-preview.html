<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Dots Preview</title>
<style>
  :root {
    --navy: #1a2744; --navy-mid: #243460; --navy-light: #2e4080;
    --gold: #c9a84c; --gold-light: #e8c97a;
    --green: #2d6a4f; --green-light: #52b788;
    --red: #922b21; --red-light: #e74c3c;
    --orange: #d9822b;
    --bg: #f0f2f7; --card: #ffffff; --text: #1a2744; --text-muted: #5a6a8a; --border: #dde2f0;
    --radius: 14px; --shadow: 0 4px 24px rgba(26,39,68,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .mock-bar { background: #3a2a0a; color: #fff; padding: 10px 16px; font-size: 12px; line-height: 1.5; position: sticky; top: 0; z-index: 5; }
  .mock-bar b { color: var(--gold-light); }
  .mock-tab { margin: 6px 6px 0 0; background: transparent; border: 1.5px solid rgba(255,255,255,0.35); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .mock-tab.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  /* existing result card (unchanged) */
  .result-card { background: var(--card); border-radius: var(--radius); padding: 28px 22px 22px; text-align: center; box-shadow: var(--shadow); margin-bottom: 20px; }
  .result-emoji { font-size: 48px; }
  .result-score { font-size: 46px; font-weight: 900; color: var(--navy); line-height: 1; margin-top: 8px; }
  .result-score span { font-size: 22px; font-weight: 500; color: var(--text-muted); }
  /* fail: whole score line red; pass stays navy */
  .result-score.fail, .result-score.fail span { color: var(--red-light); }
  .result-label { font-size: 15px; font-weight: 800; color: var(--red); margin-top: 8px; letter-spacing: 0.02em; }
  .result-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .rb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .rb div { background: var(--bg); border-radius: 10px; padding: 12px 6px; }
  .rb b { display: block; font-size: 22px; } .rb small { font-size: 12px; color: var(--text-muted); }

  /* NEW: question result dots (inside the result card, under the 3 boxes) */
  .rdots-wrap { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .rdots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .rdot { aspect-ratio: 1; width: 100%; max-width: 30px; justify-self: center; padding: 0; border-radius: 50%; border: 2px solid transparent; font-size: 10.5px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .rdot.ok { background: var(--green-light); border-color: var(--green-light); }
  .rdot.bad { background: var(--red-light); border-color: var(--red-light); }
  .rdot.skip { background: var(--card); border-color: var(--red-light); color: var(--red-light); }
  /* option A: flag = orange ring around the green / red dot */
  .flagA .rdot.flag { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--orange); }
  /* option B: flag = solid orange */
  .flagB .rdot.flag { background: var(--orange); border-color: var(--orange); color: #fff; }
  .rmeta { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 5px; margin-top: 10px; font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  .rmeta .sep { color: var(--border); }
  .rmeta i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  .rhint { font-size: 10.5px; color: var(--text-muted); text-align: left; margin-top: 4px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chip b { font-weight: 800; }
  .chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip:disabled { opacity: 0.45; cursor: default; }
  .chip .chip-flag { width: 13px; height: 13px; }
  .chip .chip-flag path { fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .empty { font-size: 13px; color: var(--text-muted); text-align: center; padding: 18px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 12px; }
  .review-item { background: var(--card); border-radius: 10px; padding: 14px 16px; border-left: 4px solid var(--border); font-size: 13px; margin-bottom: 10px; scroll-margin-top: 90px; transition: box-shadow 0.3s; }
  .review-item.ok { border-color: var(--green-light); } .review-item.bad { border-color: var(--red-light); }
  .review-item.hl { box-shadow: 0 0 0 3px var(--gold); }
  .rv-q { font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .rv-your { color: var(--text-muted); font-size: 12px; }
  /* translation + note: separated from the answer, one row per note line, hanging indent for bullets */
  .rv-tr { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .rv-yue { color: #6b3fa0; font-size: 12.5px; line-height: 1.6; }
  .rv-note { margin-top: 10px; color: #6b3fa0; font-size: 12.5px; line-height: 1.6; }
  .rv-note-label { color: #b5680a; font-weight: 700; margin-bottom: 4px; }
  .rv-note-line { margin-bottom: 6px; }
  .rv-note-line:last-child { margin-bottom: 0; }
  .rv-note-line.bullet { padding-left: 1.1em; text-indent: -1.1em; }
  .rv-note-line.sub { padding-left: 2.2em; text-indent: -1.1em; }
  .rv-note-gap { height: 6px; }
  .rv-ans { color: var(--green); font-size: 12px; font-weight: 600; }
  .rv-flag { width: 15px; height: 15px; margin-left: 5px; vertical-align: -2px; }
  .rv-flag path { fill: var(--orange); stroke: var(--orange); stroke-width: 2; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="mock-bar">
  <b>PREVIEW v6</b> · Exam result page — 備注逐行分開、列點縮排，唔再擠埋一齊。撳圓點會跳去下面嗰題。<br>
  <button class="mock-tab" onclick="demo(false)">唔合格 17/24</button><button class="mock-tab" onclick="demo(true)">合格 19/24</button>
</div>

<div class="wrap">
  <div class="result-card">
    <div class="result-emoji" id="emoji" title="Exam mode">📝</div>
    <div class="result-score" id="score"></div>
    <div class="result-label" id="verdict">NEEDS IMPROVEMENT</div>
    <div class="result-sub">You need 18/24 (75%) to pass the real test.</div>
    <div class="rdots-wrap" id="rwrap">
      <div class="rdots" id="rdots"></div>
      <div class="rmeta" id="rmeta"></div>
    </div>
  </div>

  <div class="section-title">Review Answers</div>
  <div class="chip-row" id="filters"></div>
  <div id="review"></div>
</div>

<script>
  const QS = [{"q":"What was the last battle between Great Britain and France?","ans":"The Battle of Waterloo","o":["The Battle of Trafalgar","The Battle of Waterloo","The Battle of Hastings","The Battle of Agincourt"],"a":[1],"d":1,"yue":"英法兩國最後一場戰役係乜嘢？","note":"記憶法（英國重要戰役，按年份）：\n• 9 世紀 → vs Vikings（維京人）→ Alfred the Great（阿爾弗雷德大帝）統一盎格魯-撒克遜王國 → 打敗維京人；\n• 1066 → vs Normandy（諾曼第）→ Battle of Hastings（黑斯廷斯戰役）→ William of Normandy（諾曼第公爵威廉）打敗 Harold → 英格蘭戰敗，諾曼征服；\n• 1314 → vs Scotland（蘇格蘭）→ Battle of Bannockburn（班諾克本戰役）→ Robert the Bruce 打敗英格蘭 → 蘇格蘭保持獨立；\n• 1588 → vs Spain（西班牙）→ Spanish Armada（西班牙無敵艦隊）→ Elizabeth I 年代英格蘭擊敗西班牙；\n• 1805 → vs France（法國）+ Spain（西班牙）→ Battle of Trafalgar（特拉法加海戰）→ Admiral Nelson（納爾遜）打敗法西聯合艦隊 → Nelson 陣亡；\n• 1815 → vs France（法國）→ Battle of Waterloo（滑鐵盧戰役）→ Duke of Wellington（威靈頓公爵）打敗 Napoleon → 英法最後一戰；\n• 1940 → vs Germany（德國）→ Battle of Britain（不列顛戰役）→ 皇家空軍擊退德國空襲 → 阻止德國入侵。"},{"q":"Which flower is associated with Wales?","ans":"Daffodil","o":["Daffodil","Rose","Shamrock","Thistle"],"a":[0],"d":2,"yue":"哪種花與威爾斯有關？","note":"記憶法：\nThistle（薊花）→ Scotland（蘇格蘭）；\nTudor rose（都鐸玫瑰）→ England（英格蘭）；\nDaffodil（水仙花）→ Wales（威爾斯）；\nShamrock（三葉草）→ Northern Ireland（北愛爾蘭）。"},{"q":"During the reign of Charles II, parts of London were destroyed by:","ans":"A fire","o":["A war","A flood","A fire","An earthquake"],"a":[2],"d":3,"yue":"查理二世年代，倫敦部分地區被摧毀，原因係：","note":"1666年倫敦大火，包括聖保羅大教堂"},{"q":"How often are general elections held in the UK?","ans":"Every 5 years","o":["Every 3 years","Every 4 years","Every 5 years","Every 10 years"],"a":[2],"d":2,"yue":"英國大選多久舉行一次？","note":"記憶法：\n650 個選區（constituency）→ 每區選 1 位國會議員（Member of Parliament, MP）→ 下議院共 650 位 MP；\n大選（general election）→ 每 5 年一次；\nMP 中途去世或辭職 → 補選（by-election）。"},{"q":"Scotland has its own banknotes, which are valid everywhere in the UK. True or False?","ans":"True","o":["True","False"],"a":[0],"d":5,"yue":"蘇格蘭有自己的鈔票，在英國全境通用。對定錯？","note":""},{"q":"What charity works to preserve important buildings, coastline and countryside in the UK?","ans":"The National Trust","o":["Shelter","Age UK","Crisis","The National Trust"],"a":[3],"d":2,"yue":"哪個慈善機構致力保護英國重要建築、海岸和郊野？","note":""},{"q":"Great Britain refers only to England, Wales and Scotland. True or False?","ans":"True","o":["True","False"],"a":[0],"d":4,"yue":"「大不列顛」只包括英格蘭、威爾斯和蘇格蘭。對定錯？","note":"「英國」(UK) 才包括北愛爾蘭"},{"q":"What job did Isaac Newton have at the Royal Mint?","ans":"Warden / Master","o":["Accountant","Warden / Master","Designer","Security guard"],"a":[1],"d":5,"yue":"牛頓在皇家鑄幣廠擔任什麼職位？","note":""},{"q":"Where is Ben Nevis?","ans":"Scotland","o":["Wales","England","Scotland","Northern Ireland"],"a":[2],"d":2,"yue":"Ben Nevis（本尼維斯山）喺哪裏？","note":"英國最高山，海拔1,345米"},{"q":"What is the official home of the Prime Minister?","ans":"10 Downing Street","o":["Buckingham Palace","10 Downing Street","Windsor Castle","The Houses of Parliament"],"a":[1],"d":1,"yue":"首相的官邸係哪裏？","note":""},{"q":"What is the capital city of England?","ans":"London","o":["Manchester","Birmingham","Leeds","London"],"a":[3],"d":1,"yue":"英格蘭首都係哪裏？","note":"記憶法：\nEdinburgh（愛丁堡）→ Scotland（蘇格蘭）；\nLondon（倫敦）→ England（英格蘭）；\nCardiff（加的夫）→ Wales（威爾斯）；\nBelfast（貝爾法斯特）→ Northern Ireland（北愛爾蘭）。"},{"q":"What is Diwali?","ans":"A Hindu festival also known as the Festival of Lights","o":["A Muslim festival marking the end of Ramadan","A Sikh harvest festival","A Hindu festival also known as the Festival of Lights","A Buddhist celebration"],"a":[2],"d":2,"yue":"排燈節係乜嘢？","note":""},{"q":"When did the First World War end?","ans":"1918","o":["1916","1917","1918","1919"],"a":[2],"d":3,"yue":"第一次世界大戰係哪年結束？","note":"11月11日停戰"},{"q":"What is the Domesday Book?","ans":"A survey of England commissioned by William the Conqueror in 1086","o":["A book of English laws","A survey of England commissioned by William the Conqueror in 1086","A medieval Bible","A record of all criminal cases"],"a":[1],"d":3,"yue":"《末日審判書》係乜嘢？","note":""},{"q":"Where is Snowdonia National Park?","ans":"Wales","o":["England","Wales","Scotland","Northern Ireland"],"a":[1],"d":2,"yue":"雪墩國家公園在哪裏？","note":""},{"q":"What is the Church of England?","ans":"The established Protestant church of England, founded by Henry VIII","o":["A Catholic church","The established Protestant church of England, founded by Henry VIII","A Presbyterian church","A Methodist church"],"a":[1],"d":2,"yue":"英格蘭教會係乜嘢？","note":""},{"q":"What limited the power of the English King in 1215?","ans":"The Magna Carta","o":["The Bill of Rights","The Magna Carta","The Act of Union","The Petition of Right"],"a":[1],"d":1,"yue":"1215年哪份文件限制了英格蘭國王的權力？","note":"金約翰簽署，奠定法治基礎"},{"q":"Who defeated Harold at the Battle of Hastings?","ans":"William, Duke of Normandy","o":["King Canute","William, Duke of Normandy","Julius Caesar","Edward the Confessor"],"a":[1],"d":1,"yue":"誰在黑斯廷斯戰役打敗哈羅德國王？","note":"記憶法（英國重要戰役，按年份）：\n• 9 世紀 → vs Vikings（維京人）→ Alfred the Great（阿爾弗雷德大帝）統一盎格魯-撒克遜王國 → 打敗維京人；\n• 1066 → vs Normandy（諾曼第）→ Battle of Hastings（黑斯廷斯戰役）→ William of Normandy（諾曼第公爵威廉）打敗 Harold → 英格蘭戰敗，諾曼征服；\n• 1314 → vs Scotland（蘇格蘭）→ Battle of Bannockburn（班諾克本戰役）→ Robert the Bruce 打敗英格蘭 → 蘇格蘭保持獨立；\n• 1588 → vs Spain（西班牙）→ Spanish Armada（西班牙無敵艦隊）→ Elizabeth I 年代英格蘭擊敗西班牙；\n• 1805 → vs France（法國）+ Spain（西班牙）→ Battle of Trafalgar（特拉法加海戰）→ Admiral Nelson（納爾遜）打敗法西聯合艦隊 → Nelson 陣亡；\n• 1815 → vs France（法國）→ Battle of Waterloo（滑鐵盧戰役）→ Duke of Wellington（威靈頓公爵）打敗 Napoleon → 英法最後一戰；\n• 1940 → vs Germany（德國）→ Battle of Britain（不列顛戰役）→ 皇家空軍擊退德國空襲 → 阻止德國入侵。"},{"q":"What is the Eden Project?","ans":"A visitor attraction in Cornwall featuring giant greenhouse biomes","o":["A visitor attraction in Cornwall featuring giant greenhouse biomes","A national park in Devon","A royal garden in London","A science museum in Bristol"],"a":[0],"d":3,"yue":"伊甸園計劃係乜嘢？","note":""},{"q":"What do Members of the House of Lords do?","ans":"Examine and revise laws proposed by the House of Commons","o":["Write new laws independently","Examine and revise laws proposed by the House of Commons","Manage local councils","Appoint judges"],"a":[1],"d":1,"yue":"上議院議員做乜嘢？","note":"上議院不能拒絕財政法案"},{"q":"The National Assembly for Wales is located in which city?","ans":"Cardiff","o":["Swansea","Cardiff","Newport","Bangor"],"a":[1],"d":4,"yue":"威爾斯國民議會位於哪個城市？","note":""},{"q":"Who wrote 'Pride and Prejudice'?","ans":"Jane Austen","o":["Charlotte Brontë","George Eliot","Jane Austen","Thomas Hardy"],"a":[2],"d":2,"yue":"《傲慢與偏見》係誰寫嘅？","note":""},{"q":"What happened during the Blitz?","ans":"Germany bombed British cities during WWII","o":["A German land invasion","Germany bombed British cities during WWII","The Battle of Britain air fight","British bombing of Berlin"],"a":[1],"d":3,"yue":"倫敦大轟炸（Blitz）發生了什麼事？","note":"1940–1941年"},{"q":"Who is referred to as the Iron Duke?","ans":"The Duke of Wellington","o":["Oliver Cromwell","The Duke of Wellington","Winston Churchill","Admiral Nelson"],"a":[1],"d":1,"yue":"「鐵公爵」係指誰？","note":"打敗拿破崙的名將"}];
  // sample outcome: 17 correct, 6 wrong, 1 unanswered; 5 flagged (mix of right and wrong)
  const WRONG = [2, 6, 9, 14, 19, 21];
  const SKIPPED = [17];
  const FLAGGED = [1, 2, 12, 16, 22];
  const mode = 'A';
  const PASS_MARK = 18;
  let wrongSet = [2, 6, 9, 14, 19, 21];
  let filter = 'all';
  // note text uses \n per line; "• " / "→ " start a bullet, 4 leading spaces + "◦ " a sub-bullet
  function noteHtml(note) {
    return note.split('\n').map(line => {
      if (!line.trim()) return '<div class="rv-note-gap"></div>';
      const sub = /^\s{2,}/.test(line), bullet = /^\s*[•◦→]/.test(line);
      const cls = sub ? 'sub' : bullet ? 'bullet' : '';
      return `<div class="rv-note-line ${cls}">${line.trim()}</div>`;
    }).join('');
  }
  function setFilter(f) { filter = f; render(); }
  function demo(pass) { wrongSet = pass ? [2, 9, 14, 21] : [2, 6, 9, 14, 19, 21]; render(); }
  const FLAG_ICON = '<svg class="rv-flag" viewBox="0 0 24 24" aria-label="Flagged"><path d="M7.5 3.5h9A2.5 2.5 0 0 1 19 6v14.5l-7-5.1-7 5.1V6a2.5 2.5 0 0 1 2.5-2.5z"/></svg>';
  const status = i => SKIPPED.includes(i) ? 'skip' : wrongSet.includes(i) ? 'bad' : 'ok';

  function render() {
    const ok = QS.filter((_, i) => status(i) === 'ok').length;
    document.getElementById('score').innerHTML = `${ok} <span>/ ${QS.length} · ${Math.round(ok / QS.length * 100)}%</span>`;
    document.getElementById('score').classList.toggle('fail', ok < PASS_MARK);
    document.getElementById('verdict').textContent = ok >= PASS_MARK ? 'PASSED' : 'NEEDS IMPROVEMENT';
    document.getElementById('verdict').style.color = ok >= PASS_MARK ? 'var(--green)' : 'var(--red)';
    document.getElementById('emoji').textContent = '📝';
    document.getElementById('rwrap').className = 'rdots-wrap flag' + mode;
    document.getElementById('rdots').innerHTML = QS.map((_, i) =>
      `<button class="rdot ${status(i)}${FLAGGED.includes(i) ? ' flag' : ''}" onclick="jump(${i})" title="Question ${i + 1}">${i + 1}</button>`).join('');
    const skip = SKIPPED.length, bad = QS.length - ok - skip;
    document.getElementById('rmeta').innerHTML = [
      `<span><i style="background:var(--green-light)"></i>Correct <b>${ok}</b></span>`,
      `<span><i style="background:var(--red-light)"></i>Wrong <b>${bad}</b></span>`,
      `<span><i style="border:2px solid var(--red-light)"></i>Unanswered <b>${skip}</b></span>`,
      `<span><i style="${mode === 'A' ? 'box-shadow:0 0 0 2px var(--orange)' : 'background:var(--orange)'}"></i>Flagged <b>${FLAGGED.length}</b></span>`,
    ].join(' <span class="sep">|</span> ');
    const wrongN = QS.filter((_, i) => status(i) !== 'ok').length;
    const chip = (key, label, n) => `<button class="chip${filter === key ? ' active' : ''}" onclick="setFilter('${key}')"${n ? '' : ' disabled'}>${label} <b>${n}</b></button>`;
    document.getElementById('filters').innerHTML =
      chip('all', 'All', QS.length) + chip('wrong', 'Wrong', wrongN) +
      chip('flagged', FLAG_ICON.replace('rv-flag', 'chip-flag') + 'Flagged', FLAGGED.length);
    const keep = i => filter === 'all' || (filter === 'wrong' ? status(i) !== 'ok' : FLAGGED.includes(i));
    const shown = QS.map((q, i) => i).filter(keep);
    document.getElementById('review').innerHTML = !shown.length ? '<div class="empty">Nothing here.</div>' : QS.map((q, i) => {
      if (!keep(i)) return '';
      const st = status(i);
      const your = st === 'ok' ? '' : `<div class="rv-your">Your answer: ${st === 'skip' ? 'No answer' : q.o.find((_, k) => !q.a.includes(k))}</div>`;
      return `<div class="review-item ${st === 'ok' ? 'ok' : 'bad'}" id="rv${i}">
        <div class="rv-q">${i + 1}. ${q.q}${FLAGGED.includes(i) ? FLAG_ICON : ''}</div>${your}
        <div class="rv-ans">✅ ${q.ans}</div>
        <div class="rv-tr">
          <div class="rv-yue">【廣東話】${q.yue}</div>
          ${q.note ? `<div class="rv-note"><div class="rv-note-label">💡 備注：</div>${noteHtml(q.note)}</div>` : ''}
        </div></div>`;
    }).join('');
  }
  function jump(i) {
    if (filter !== 'all' && !document.getElementById('rv' + i)) { filter = 'all'; render(); }
    const el = document.getElementById('rv' + i);
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1500);
  }
  render();
</script>
</body>
</html>
