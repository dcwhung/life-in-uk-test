<title>Life in UK Usage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: navy app bar → range filter → 4 summary tiles → two full-width charts → daily table; one column on phones.
   Tokens follow the app's own (css/base/tokens.css): navy bar, #f0f2f7 page, white cards; chart hues validated
   with the dataviz palette validator (light on #fff, dark on #1a2744). */
:root {
  --bg: #f0f2f7;
  --card: #ffffff;
  --text: #1a2744;
  --text-muted: #5a6a8a;
  --border: #dde2f0;
  --grid: #e8ebf4;
  --bar: #1a2744;
  --bar-text: #ffffff;
  --bar-muted: rgba(255,255,255,0.6);
  --chip-bg: rgba(255,255,255,0.1);
  --chip-on-bg: #ffffff;
  --chip-on-text: #1a2744;
  --series-1: #3d5bc4;   /* all opens / dau */
  --series-2: #b8892a;   /* installed-app opens */
  --area-1: rgba(61,91,196,0.10);
  --up: #2d6a4f;
  --down: #922b21;
  --note-bg: #fdf6e3;
  --note-text: #8a6d1f;
  --focus: #3d5bc4;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang HK', 'Noto Sans HK', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a2e; --card: #1a2744; --text: #e8ecf6; --text-muted: #9aa8c7; --border: #2e3d63; --grid: #26355a;
  --bar: #0c1424; --chip-on-bg: #e8ecf6; --chip-on-text: #1a2744;
  --series-1: #6a88ea; --series-2: #b5862a; --area-1: rgba(106,136,234,0.12);
  --up: #52b788; --down: #e88a80; --note-bg: #2a2a1e; --note-text: #e8c97a; --focus: #6a88ea; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111a2e; --card: #1a2744; --text: #e8ecf6; --text-muted: #9aa8c7; --border: #2e3d63; --grid: #26355a;
  --bar: #0c1424; --chip-on-bg: #e8ecf6; --chip-on-text: #1a2744;
  --series-1: #6a88ea; --series-2: #b5862a; --area-1: rgba(106,136,234,0.12);
  --up: #52b788; --down: #e88a80; --note-bg: #2a2a1e; --note-text: #e8c97a; --focus: #6a88ea; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* app bar */
.appbar { background: var(--bar); color: var(--bar-text); }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font-size: 17px; letter-spacing: 0.01em; }
.brand span { color: var(--bar-muted); font-size: 12.5px; }
.chips { display: flex; gap: 6px; }
.chip { border: 0; background: var(--chip-bg); color: var(--bar-text); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-text); font-weight: 600; }
.ghost { border: 1px solid rgba(255,255,255,0.25); background: transparent; color: var(--bar-text); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }

main { display: grid; gap: 16px; padding-block: 18px 40px; }
.note { background: var(--note-bg); color: var(--note-text); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.note button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }

/* summary tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .label { color: var(--text-muted); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .delta { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.delta .up { color: var(--up); font-weight: 600; }
.delta .down { color: var(--down); font-weight: 600; }

/* chart cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 8px; }
.card h2 { font-size: 15.5px; margin: 0; text-wrap: balance; }
.card .sub { color: var(--text-muted); font-size: 12.5px; margin: 2px 0 0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart { min-height: 220px; }
.chart text { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.chart .end-label { fill: var(--text); font-weight: 600; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--card); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.45; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 600; font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
td.zero { color: var(--text-muted); }

/* sign-in state */
.signin { max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: grid; gap: 12px; }
.signin h2 { margin: 0; font-size: 18px; }
.signin p { margin: 0; color: var(--text-muted); font-size: 14px; }
.signin label { font-size: 13px; font-weight: 600; }
.signin input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
.primary { border: 0; background: var(--bar); color: var(--bar-text); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.error { color: var(--down); font-size: 13px; }

@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .value { font-size: 24px; } }
</style>

<header class="appbar">
  <div class="wrap">
    <div class="brand"><b>Life in UK · 使用統計</b><span>life-uk.vercel.app · 日期以 UTC 計</span></div>
    <div class="chips" role="group" aria-label="時間範圍" id="rangeChips">
      <button class="chip" data-days="7" aria-pressed="false">7 日</button>
      <button class="chip" data-days="30" aria-pressed="true">30 日</button>
      <button class="chip" data-days="90" aria-pressed="false">90 日</button>
    </div>
    <button class="ghost" id="refreshBtn" type="button">重新整理</button>
    <button class="ghost" id="signOutBtn" type="button">登出</button>
  </div>
</header>

<div class="wrap">
  <main id="dash">
    <div class="note">
      <span><b>Mockup</b> · 示範數據，唔係真實數字</span>
      <button type="button" id="showSignIn">預覽登入畫面</button>
    </div>

    <section class="tiles" aria-label="摘要">
      <div class="tile"><span class="label">開 app 次數</span><span class="value" id="tOpen">–</span><span class="delta" id="dOpen"></span></div>
      <div class="tile"><span class="label">平均每日活躍裝置</span><span class="value" id="tDau">–</span><span class="delta" id="dDau"></span></div>
      <div class="tile"><span class="label">新安裝</span><span class="value" id="tInstall">–</span><span class="delta" id="dInstall"></span></div>
      <div class="tile"><span class="label">用已安裝 app 開</span><span class="value" id="tShare">–</span><span class="delta" id="dShare"></span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2>每日活躍裝置</h2><p class="sub">每部機每個 UTC 日計一次</p></div>
      </div>
      <div class="chart" id="dauChart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2>每日開 app 次數</h2><p class="sub">已安裝 app 開啟係全部開啟入面嘅一部分</p></div>
        <div class="legend"><span><i style="background: var(--series-1)"></i>全部開啟</span><span><i style="background: var(--series-2)"></i>已安裝 app</span></div>
      </div>
      <div class="chart" id="openChart"></div>
    </section>

    <section class="card">
      <div class="card-head"><div><h2>每日明細</h2><p class="sub">最新日子排最上</p></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>開啟</th><th>已安裝 app</th><th>活躍裝置</th><th>新安裝</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <form class="signin" id="signin" hidden>
    <h2>輸入 Stats token</h2>
    <p>即係 Vercel 入面 <code>STATS_TOKEN</code> 嘅值。只會儲存喺呢部機嘅瀏覽器。</p>
    <label for="tokenInput">Token</label>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="64 個字元">
    <span class="error" id="signinError">Token 唔啱，請再檢查一次（401）</span>
    <button class="primary" type="submit">睇統計</button>
    <button class="ghost" type="button" id="backToDash" style="color: var(--text); border-color: var(--border)">返回示範 dashboard</button>
  </form>
</div>

<script>
// ── sample data (deterministic; the real page reads GET /api/stats?days=N) ──
const END = Date.UTC(2026, 9, 14);
const DAY_MS = 86400000;
const MAX_DAYS = 90;
function sampleDays() {
  const rows = [];
  for (let i = MAX_DAYS * 2 - 1; i >= 0; i--) {
    const t = MAX_DAYS * 2 - i;
    const date = new Date(END - i * DAY_MS).toISOString().slice(0, 10);
    const weekday = new Date(END - i * DAY_MS).getUTCDay();
    const wave = 1 + 0.25 * Math.sin(t * 0.9) + (weekday === 0 || weekday === 6 ? 0.2 : 0);
    const dau = Math.round((14 + t * 0.32) * wave);
    const open = Math.round(dau * (1.9 + 0.3 * Math.sin(t * 1.7)));
    const standalone = Math.round(open * (0.22 + t * 0.0012));
    const install = Math.max(0, Math.round(1 + t * 0.012 + 1.2 * Math.sin(t * 2.3)));
    rows.push({ date, open, standalone, dau, install });
  }
  return rows.reverse(); // newest first, as /api/stats returns
}
const ALL = sampleDays();

const sum = (rows, k) => rows.reduce((n, r) => n + r[k], 0);
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + 'K' : n.toLocaleString('en-GB');
const pct = n => Math.round(n * 100) + '%';
const shortDate = iso => `${Number(iso.slice(8))}/${Number(iso.slice(5, 7))}`;
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
// clean ticks: step = 1 / 2 / 5 × 10^k so every tick label is a round number the axis really reaches
const TICKS = 4;
function niceScale(v) {
  const raw = Math.max(v, 1) / TICKS;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(m => m >= raw);
  return { step, max: Math.ceil(v / step) * step };
}

function deltaHtml(cur, prev, asPoints) {
  if (!prev) return '前一段時間冇數據';
  const diff = asPoints ? Math.round((cur - prev) * 100) : Math.round((cur - prev) / prev * 100);
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  const sign = diff > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${diff}${asPoints ? ' 個百分點' : '%'}</span> 對比前 ${current.days} 日`;
}

// ── summary tiles ──
function renderTiles(rows, prev) {
  const share = r => sum(r, 'open') ? sum(r, 'standalone') / sum(r, 'open') : 0;
  const avgDau = r => sum(r, 'dau') / r.length;
  document.getElementById('tOpen').textContent = fmt(sum(rows, 'open'));
  document.getElementById('dOpen').innerHTML = deltaHtml(sum(rows, 'open'), sum(prev, 'open'));
  document.getElementById('tDau').textContent = fmt(Math.round(avgDau(rows)));
  document.getElementById('dDau').innerHTML = deltaHtml(avgDau(rows), avgDau(prev));
  document.getElementById('tInstall').textContent = fmt(sum(rows, 'install'));
  document.getElementById('dInstall').innerHTML = deltaHtml(sum(rows, 'install'), sum(prev, 'install'));
  document.getElementById('tShare').textContent = pct(share(rows));
  document.getElementById('dShare').innerHTML = deltaHtml(share(rows), share(prev), true);
}

// ── charts: one scale per chart, ticks at clean values, hover tooltip ──
// drawn at the card's real pixel width so text stays 11px on phones
let W = 960;
const H = 220, PAD = { l: 36, r: 40, t: 12, b: 28 };
function frame(host, scale, rows) {
  host.innerHTML = '';
  W = Math.max(280, Math.round(host.clientWidth));
  const maxV = scale.max;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, host);
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  const y = v => PAD.t + plotH - (v / maxV) * plotH;
  for (let v = 0; v <= maxV; v += scale.step) {
    el('line', { x1: PAD.l, x2: W - PAD.r, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }, svg);
    el('text', { x: PAD.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmt(v);
  }
  const n = rows.length;
  const band = plotW / n;
  const x = i => PAD.l + band * i + band / 2;
  const every = Math.ceil(n / Math.max(3, Math.floor(plotW / 70)));
  rows.forEach((r, i) => {
    if ((n - 1 - i) % every === 0) el('text', { x: x(i), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = shortDate(r.date);
  });
  return { svg, y, x, band, plotH };
}
function attachHover(host, svg, rows, x, band, lines) {
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
  const guide = el('line', { y1: PAD.t, y2: H - PAD.b, stroke: 'var(--text-muted)', 'stroke-width': 1, opacity: 0 }, svg);
  rows.forEach((r, i) => {
    const hit = el('rect', { x: x(i) - band / 2, y: PAD.t, width: band, height: H - PAD.t - PAD.b, fill: 'transparent' }, svg);
    hit.addEventListener('pointerenter', () => {
      guide.setAttribute('x1', x(i)); guide.setAttribute('x2', x(i)); guide.setAttribute('opacity', 0.35);
      tip.innerHTML = `<b>${r.date}</b><br>` + lines.map(l => `<i style="background:${l.color}"></i>${l.label} ${fmt(r[l.key])}`).join('<br>');
      const box = host.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(x(i), 70), box.width - 70) + 'px';
      tip.style.top = '24px';
      tip.hidden = false;
    });
    hit.addEventListener('pointerleave', () => { tip.hidden = true; guide.setAttribute('opacity', 0); });
  });
}

function renderDau(rows) {
  const host = document.getElementById('dauChart');
  const { svg, y, x, band } = frame(host, niceScale(Math.max(...rows.map(r => r.dau))), rows);
  const w = Math.min(24, Math.max(2, band - 2)); // 2px surface gap between bars
  const base = y(0);
  rows.forEach((r, i) => {
    const top = y(r.dau), h = base - top, rad = Math.min(4, w / 2, h);
    // 4px rounded data end, square at the baseline
    el('path', { d: `M${x(i) - w / 2},${base} V${top + rad} Q${x(i) - w / 2},${top} ${x(i) - w / 2 + rad},${top} H${x(i) + w / 2 - rad} Q${x(i) + w / 2},${top} ${x(i) + w / 2},${top + rad} V${base} Z`, fill: 'var(--series-1)' }, svg);
  });
  const last = rows[rows.length - 1];
  el('text', { x: x(rows.length - 1) + w / 2 + 6, y: y(last.dau) + 4, class: 'end-label' }, svg).textContent = fmt(last.dau);
  attachHover(host, svg, rows, x, band, [{ key: 'dau', label: '活躍裝置', color: 'var(--series-1)' }]);
}

function renderOpens(rows) {
  const host = document.getElementById('openChart');
  const { svg, y, x, band } = frame(host, niceScale(Math.max(...rows.map(r => r.open))), rows);
  const series = [
    { key: 'open', label: '全部開啟', color: 'var(--series-1)', area: true },
    { key: 'standalone', label: '已安裝 app', color: 'var(--series-2)' },
  ];
  for (const s of series) {
    const pts = rows.map((r, i) => `${x(i)},${y(r[s.key])}`);
    if (s.area) el('path', { d: `M${x(0)},${y(0)} L${pts.join(' L')} L${x(rows.length - 1)},${y(0)} Z`, fill: 'var(--area-1)' }, svg);
    el('polyline', { points: pts.join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    const last = rows[rows.length - 1];
    el('circle', { cx: x(rows.length - 1), cy: y(last[s.key]), r: 4, fill: s.color, stroke: 'var(--card)', 'stroke-width': 2 }, svg);
    el('text', { x: x(rows.length - 1) + 10, y: y(last[s.key]) + 4, class: 'end-label' }, svg).textContent = fmt(last[s.key]);
  }
  attachHover(host, svg, rows, x, band, series);
}

function renderTable(rows) {
  document.getElementById('rows').innerHTML = rows.map(r =>
    `<tr><td>${r.date}</td>${['open', 'standalone', 'dau', 'install'].map(k => `<td class="${r[k] ? '' : 'zero'}">${fmt(r[k])}</td>`).join('')}</tr>`).join('');
}

const current = { days: 30 };
function render() {
  const rows = ALL.slice(0, current.days);
  const prev = ALL.slice(current.days, current.days * 2);
  renderTiles(rows, prev);
  const chrono = rows.slice().reverse(); // charts read oldest → newest
  renderDau(chrono);
  renderOpens(chrono);
  renderTable(rows);
}

document.getElementById('rangeChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  current.days = Number(btn.dataset.days);
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
  try { localStorage.setItem('statsRange', String(current.days)); } catch {}
  render();
});
document.getElementById('refreshBtn').addEventListener('click', render);
const showSignIn = on => { document.getElementById('dash').hidden = on; document.getElementById('signin').hidden = !on; };
document.getElementById('showSignIn').addEventListener('click', () => showSignIn(true));
document.getElementById('signOutBtn').addEventListener('click', () => showSignIn(true));
document.getElementById('backToDash').addEventListener('click', () => showSignIn(false));
document.getElementById('signin').addEventListener('submit', e => { e.preventDefault(); showSignIn(false); });
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

try {
  const saved = Number(localStorage.getItem('statsRange'));
  if ([7, 30, 90].includes(saved)) {
    current.days = saved;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.days) === saved)));
  }
} catch {}
render();
</script>
