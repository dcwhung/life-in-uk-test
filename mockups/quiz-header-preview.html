<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Header Preview</title>
<style>
  /* tokens copied from index.html */
  :root {
    --navy: #1a2744; --navy-mid: #243460; --navy-light: #2e4080;
    --gold: #c9a84c; --gold-light: #e8c97a;
    --green: #2d6a4f; --green-light: #52b788;
    --red: #922b21; --red-light: #e74c3c;
    --purple: #6b3fa0; --purple-light: #9b6dca;
    --bg: #f0f2f7; --card: #ffffff; --text: #1a2744; --text-muted: #5a6a8a; --border: #dde2f0;
    --radius: 14px; --shadow-sm: 0 2px 8px rgba(26,39,68,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }

  /* preview-only controls */
  .mock-bar { background: var(--navy); color: #fff; padding: 12px 0; font-size: 12px; }
  .mock-bar b { color: var(--gold-light); }
  .note { font-size: 11.5px; color: #9a7a22; background: #fffbea; border: 1px dashed var(--gold); border-radius: 8px; padding: 8px 10px; margin: 14px 0; line-height: 1.55; }
  .label { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 22px 0 8px; }

  /* app header bar (unchanged) */
  .app-head { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .app-head .logo { font-weight: 800; font-size: 15px; }

  /* quiz header (unchanged) */
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .back-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .quiz-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .quiz-mode-badge { background: var(--navy); color: var(--gold-light); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; margin-left: 8px; }

  /* ═══ NEW: question card with the progress bar as its top border ═══ */
  .q-card { position: relative; background: var(--card); border-radius: var(--radius); padding: 22px 22px 24px; box-shadow: var(--shadow-sm); overflow: hidden; }
  .q-progress { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--border); }
  .q-progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-light), var(--gold)); transition: width 0.4s ease; }
  .q-num { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .q-num-text { flex: 1; display: flex; align-items: center; column-gap: 6px; row-gap: 4px; flex-wrap: wrap; white-space: nowrap; }
  .stars { color: var(--gold); letter-spacing: 0; font-size: 11px; } .stars .off { color: var(--border); }
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.55; color: var(--navy); }
  .q-yue { margin-top: 10px; padding: 10px 12px; background: #f7f4fc; border-left: 3px solid var(--purple-light); border-radius: 0 8px 8px 0; color: var(--purple); font-size: 14px; line-height: 1.6; }
  .yue-toggle { text-transform: none; letter-spacing: 0; background: #f3eefa; border: 1.5px solid var(--purple-light); color: var(--purple); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; }

  /* symbol-only quick nav */
  .quick-nav { display: inline-flex; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: var(--navy); font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .icon-btn:disabled { opacity: 0.4; }

  /* score pill (option A) */
  .score-pill { text-transform: none; letter-spacing: 0; background: #edf8f2; color: var(--green); border-radius: 999px; padding: 2px 7px; font-size: 10.5px; font-weight: 800; }
</style>
</head>
<body>

<div class="mock-bar">
  <div class="wrap" style="padding-top:0;padding-bottom:0">
    <b>PREVIEW</b> · Quiz header — option A, header stats removed
  </div>
</div>

<div class="app-head">
  <span class="logo">🇬🇧 Life in the UK</span>
</div>

<div class="wrap">
  <div class="quiz-header">
    <span class="back-btn">← Home</span>
    <span><span class="quiz-label">Chapter 4</span><span class="quiz-mode-badge">Practice</span></span>
  </div>

  <div class="note" id="note"></div>

  <div class="label">① Before answering — Translate in the corner</div>
  <div id="cardA"></div>

  <div class="label">② Answered — symbol-only ← / →</div>
  <div id="cardB"></div>

  <div class="label">③ Last question answered — → becomes ✓ (Finish / See Results), ↩ in a similar session</div>
  <div id="cardC"></div>
</div>

<script>
  const STATE = { q: 5, total: 25, correct: 4, done: 5, d: 1 };

  const stars = (d) => '★'.repeat(d) + `<span class="off">${'★'.repeat(5 - d)}</span>`;
  function card({ q, total, right, text, yue }) {
    const pct = Math.round((q / total) * 100);
    const pill = `<span class="score-pill">✓ ${STATE.correct}/${STATE.done}</span>`;
    return `<div class="q-card">
      <div class="q-progress"><div class="q-progress-fill" style="width:${pct}%"></div></div>
      <div class="q-num">
        <span class="q-num-text">Question ${q} of ${total} <span class="stars">${stars(STATE.d)}</span>${pill}</span>
        ${right}
      </div>
      <div class="q-text">${text}</div>
      <div class="q-yue">${yue}</div>
    </div>`;
  }
  const nav = (next, prevDisabled = false) => `<span class="quick-nav">
      <button class="icon-btn" ${prevDisabled ? 'disabled' : ''} title="Previous">←</button>
      <button class="icon-btn primary" title="Next">${next}</button></span>`;

  function render() {
    document.getElementById('note').innerHTML =
      '• 「4/5 correct」變做星星後面嘅綠色 pill「✓ 4/5」（答完第一題先出）<br>' +
      '• 最頂 header 嘅「✅ correct · 📝 done」已拎走<br>' +
      '• Progress bar 變咗 Question Box 頂邊（5px），原本獨立一行嘅「Question 5 of 25 · 4/5 correct」同 bar 拎走<br>' +
      '• 窄 mon 放唔落一行時，pill 會跟住星星換去第二行';
    document.getElementById('cardA').innerHTML = card({ q: 5, total: 25, right: '<span class="yue-toggle">Translate</span>',
      text: 'What does Hogmanay refer to?', yue: 'Hogmanay（霍格莫尼）係指乜嘢？' });
    document.getElementById('cardB').innerHTML = card({ q: 5, total: 25, right: nav('→'),
      text: 'What does Hogmanay refer to?', yue: 'Hogmanay（霍格莫尼）係指乜嘢？' });
    document.getElementById('cardC').innerHTML = card({ q: 25, total: 25, right: nav('✓'),
      text: 'What is the Cenotaph?', yue: 'Cenotaph（戰爭紀念碑）係乜嘢？' });
  }
  render();
</script>
</body>
</html>
