<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Mode Preview</title>
<style>
  /* tokens copied from index.html */
  :root {
    --navy: #1a2744; --navy-mid: #243460; --navy-light: #2e4080;
    --gold: #c9a84c; --gold-light: #e8c97a;
    --green: #2d6a4f; --green-light: #52b788;
    --red: #922b21; --red-light: #e74c3c;
    --purple: #6b3fa0; --purple-light: #9b6dca;
    --orange: #d9822b;
    --bg: #f0f2f7; --card: #ffffff; --text: #1a2744; --text-muted: #5a6a8a; --border: #dde2f0;
    --radius: 14px; --shadow-sm: 0 2px 8px rgba(26,39,68,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  button { font: inherit; }

  /* preview-only */
  .mock-bar { background: #3a2a0a; color: #fff; padding: 10px 16px; font-size: 12px; line-height: 1.5; }
  .mock-bar b { color: var(--gold-light); }
  .mock-bar button { margin: 6px 6px 0 0; background: transparent; border: 1.5px solid rgba(255,255,255,0.35); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; }

  /* app header (unchanged) */
  .app-head { background: var(--navy); color: #fff; padding: 12px 16px; font-weight: 800; font-size: 15px; }

  /* quiz header: + timer */
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .back-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .quiz-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .timer { display: inline-flex; align-items: center; gap: 5px; background: var(--navy); color: #fff; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer.warn { background: var(--red-light); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.7; } }

  /* NEW: question navigator (24 dots) */
  .q-card { position: relative; background: var(--card); border-radius: var(--radius); padding: 18px 18px 22px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .nav-dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-bottom: 8px; }
  .dot { position: relative; aspect-ratio: 1; width: 100%; max-width: 30px; justify-self: center; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: var(--text-muted); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .dot.done { background: var(--navy-light); border-color: var(--navy-light); color: #fff; }
  .dot.current { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--gold); }
  .dot.flag::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); border: 1.5px solid var(--card); }
  .dots-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-muted); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .dots-meta i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .flag-filter { margin-left: auto; background: #fdf3e8; color: var(--orange); border: 1.5px solid #f3d3b0; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .flag-filter:disabled { opacity: 0.45; cursor: default; }

  /* question header */
  .q-num { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .q-num-text { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; white-space: nowrap; }
  .stars { color: var(--gold); font-size: 11px; } .stars .off { color: var(--border); }
  .q-tools { display: inline-flex; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: var(--navy); font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .icon-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .icon-btn:disabled { opacity: 0.4; cursor: default; }
  .flag-btn { font-size: 14px; filter: grayscale(1); opacity: 0.55; }
  .flag-btn.on { filter: none; opacity: 1; background: #fdf3e8; border-color: var(--orange); }
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.5; color: var(--navy); }

  /* options (unchanged) */
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .opt { background: var(--card); border: 2px solid var(--border); border-radius: 11px; padding: 14px 16px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer; display: flex; align-items: flex-start; gap: 12px; text-align: left; }
  .opt-letter { min-width: 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .opt.selected { border-color: var(--navy-light); background: #f0f4ff; }
  .opt.selected .opt-letter { background: var(--navy-light); border-color: var(--navy-light); color: #fff; }
  .nav-row { display: flex; gap: 10px; justify-content: flex-end; }
  .nav-btn { background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .nav-btn.secondary { background: var(--card); color: var(--navy); border: 2px solid var(--border); }
  .nav-btn:disabled { opacity: 0.4; }

  /* time-up / result overlay (preview) */
  .overlay { position: fixed; inset: 0; background: rgba(26,39,68,0.55); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 22px; max-width: 340px; text-align: center; }
  .modal h3 { color: var(--navy); margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="mock-bar">
  <b>PREVIEW</b> · Exam mode: 45-min timer · flag · 24-dot navigator. 撳選項、🚩、圓點都試得。<br>
  <button onclick="setTime(5 * 60 + 3)">⏩ 跳去剩 5 分鐘（變紅）</button>
  <button onclick="setTime(5)">⏩ 跳去剩 5 秒（自動 submit）</button>
  <button onclick="demoFill()">填啲示範答案 / flag</button>
</div>
<div class="app-head">🇬🇧 Life in the UK</div>

<div class="wrap">
  <div class="quiz-header">
    <span class="back-btn">← Home</span>
    <span class="head-right"><span class="quiz-label">Exam 4</span><span class="timer" id="timer">⏱ 45:00</span></span>
  </div>

  <div class="q-card">
    <div class="nav-dots" id="dots"></div>
    <div class="dots-meta">
      <span><i style="background:var(--navy-light)"></i>Answered <b id="cDone">0</b></span>
      <span><i style="border:1.5px solid var(--border)"></i>Unanswered</span>
      <span><i style="background:var(--orange)"></i>Flagged</span>
      <button class="flag-filter" id="flagJump" onclick="nextFlagged()">🚩 0 flagged ›</button>
    </div>
    <div class="q-num">
      <span class="q-num-text" id="qNum"></span>
      <span class="q-tools">
        <button class="icon-btn flag-btn" id="flagBtn" onclick="toggleFlag()" title="Flag for review">🚩</button>
        <button class="icon-btn" id="qPrev" onclick="go(cur - 1)" title="Previous">←</button>
        <button class="icon-btn primary" id="qNext" onclick="go(cur + 1)" title="Next">→</button>
      </span>
    </div>
    <div class="q-text" id="qText"></div>
  </div>

  <div class="options" id="opts"></div>
  <div class="nav-row">
    <button class="nav-btn secondary" id="prevBtn" onclick="go(cur - 1)">← Prev</button>
    <button class="nav-btn" id="nextBtn"></button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <h3 id="mTitle"></h3><p id="mBody"></p>
  <button class="nav-btn" onclick="document.getElementById('overlay').classList.remove('show')">OK（preview：去結果頁）</button>
</div></div>

<script>
  const QS = [{"q":"What was the last battle between Great Britain and France?","o":["The Battle of Trafalgar","The Battle of Waterloo","The Battle of Hastings","The Battle of Agincourt"],"d":1,"m":1},{"q":"Which flower is associated with Wales?","o":["Daffodil","Rose","Shamrock","Thistle"],"d":2,"m":1},{"q":"During the reign of Charles II, parts of London were destroyed by:","o":["A war","A flood","A fire","An earthquake"],"d":3,"m":1},{"q":"How often are general elections held in the UK?","o":["Every 3 years","Every 4 years","Every 5 years","Every 10 years"],"d":2,"m":1},{"q":"Scotland has its own banknotes, which are valid everywhere in the UK. True or False?","o":["True","False"],"d":5,"m":1},{"q":"What charity works to preserve important buildings, coastline and countryside in the UK?","o":["Shelter","Age UK","Crisis","The National Trust"],"d":2,"m":1},{"q":"Great Britain refers only to England, Wales and Scotland. True or False?","o":["True","False"],"d":4,"m":1},{"q":"What job did Isaac Newton have at the Royal Mint?","o":["Accountant","Warden / Master","Designer","Security guard"],"d":5,"m":1},{"q":"Where is Ben Nevis?","o":["Wales","England","Scotland","Northern Ireland"],"d":2,"m":1},{"q":"What is the official home of the Prime Minister?","o":["Buckingham Palace","10 Downing Street","Windsor Castle","The Houses of Parliament"],"d":1,"m":1},{"q":"What is the capital city of England?","o":["Manchester","Birmingham","Leeds","London"],"d":1,"m":1},{"q":"What is Diwali?","o":["A Muslim festival marking the end of Ramadan","A Sikh harvest festival","A Hindu festival also known as the Festival of Lights","A Buddhist celebration"],"d":2,"m":1},{"q":"When did the First World War end?","o":["1916","1917","1918","1919"],"d":3,"m":1},{"q":"What is the Domesday Book?","o":["A book of English laws","A survey of England commissioned by William the Conqueror in 1086","A medieval Bible","A record of all criminal cases"],"d":3,"m":1},{"q":"Where is Snowdonia National Park?","o":["England","Wales","Scotland","Northern Ireland"],"d":2,"m":1},{"q":"What is the Church of England?","o":["A Catholic church","The established Protestant church of England, founded by Henry VIII","A Presbyterian church","A Methodist church"],"d":2,"m":1},{"q":"What limited the power of the English King in 1215?","o":["The Bill of Rights","The Magna Carta","The Act of Union","The Petition of Right"],"d":1,"m":1},{"q":"Who defeated Harold at the Battle of Hastings?","o":["King Canute","William, Duke of Normandy","Julius Caesar","Edward the Confessor"],"d":1,"m":1},{"q":"What is the Eden Project?","o":["A visitor attraction in Cornwall featuring giant greenhouse biomes","A national park in Devon","A royal garden in London","A science museum in Bristol"],"d":3,"m":1},{"q":"What do Members of the House of Lords do?","o":["Write new laws independently","Examine and revise laws proposed by the House of Commons","Manage local councils","Appoint judges"],"d":1,"m":1},{"q":"The National Assembly for Wales is located in which city?","o":["Swansea","Cardiff","Newport","Bangor"],"d":4,"m":1},{"q":"Who wrote 'Pride and Prejudice'?","o":["Charlotte Brontë","George Eliot","Jane Austen","Thomas Hardy"],"d":2,"m":1},{"q":"What happened during the Blitz?","o":["A German land invasion","Germany bombed British cities during WWII","The Battle of Britain air fight","British bombing of Berlin"],"d":3,"m":1},{"q":"Who is referred to as the Iron Duke?","o":["Oliver Cromwell","The Duke of Wellington","Winston Churchill","Admiral Nelson"],"d":1,"m":1}];
  const EXAM_SECONDS = 45 * 60;
  const WARN_SECONDS = 5 * 60;
  const LETTERS = 'ABCD';
  let cur = 0, left = EXAM_SECONDS, timerId = null;
  const answers = {}, flags = {};

  const pad = (n) => String(n).padStart(2, '0');
  const stars = (d) => '★'.repeat(d) + `<span class="off">${'★'.repeat(5 - d)}</span>`;
  const isDone = (i) => (answers[i] || []).length > 0;
  const flaggedList = () => QS.map((_, i) => i).filter((i) => flags[i]);

  function renderTimer() {
    const t = document.getElementById('timer');
    t.textContent = `⏱ ${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
    t.classList.toggle('warn', left <= WARN_SECONDS);
  }
  function tick() {
    left = Math.max(0, left - 1); renderTimer();
    if (!left) { clearInterval(timerId); finish(true); }
  }
  function setTime(s) { left = s; renderTimer(); }

  function renderDots() {
    document.getElementById('dots').innerHTML = QS.map((_, i) =>
      `<button class="dot${isDone(i) ? ' done' : ''}${flags[i] ? ' flag' : ''}${i === cur ? ' current' : ''}" onclick="go(${i})" title="Question ${i + 1}">${i + 1}</button>`).join('');
    document.getElementById('cDone').textContent = QS.filter((_, i) => isDone(i)).length;
    const n = flaggedList().length, fj = document.getElementById('flagJump');
    fj.textContent = `🚩 ${n} flagged ›`; fj.disabled = !n;
  }
  function render() {
    const q = QS[cur], last = cur === QS.length - 1;
    document.getElementById('qNum').innerHTML = `<span>Question ${cur + 1} of ${QS.length}${q.m > 1 ? ` (select ${q.m})` : ''}</span><span class="stars">${stars(q.d)}</span>`;
    document.getElementById('qText').textContent = q.q;
    const fb = document.getElementById('flagBtn');
    fb.classList.toggle('on', !!flags[cur]); fb.title = flags[cur] ? 'Unflag' : 'Flag for review';
    document.getElementById('opts').innerHTML = q.o.map((o, i) =>
      `<button class="opt${(answers[cur] || []).includes(i) ? ' selected' : ''}" onclick="pick(${i})"><span class="opt-letter">${LETTERS[i]}</span><span>${o}</span></button>`).join('');
    document.getElementById('qPrev').disabled = document.getElementById('prevBtn').disabled = cur === 0;
    document.getElementById('qNext').style.display = last ? 'none' : '';
    const nb = document.getElementById('nextBtn');
    nb.textContent = last ? 'Submit' : 'Next →';
    nb.onclick = last ? () => finish(false) : () => go(cur + 1);
    renderDots();
  }
  function go(i) { if (i < 0 || i >= QS.length) return; cur = i; render(); }
  function pick(i) {
    const q = QS[cur], a = answers[cur] || [];
    if (q.m > 1) { const k = a.indexOf(i); k < 0 ? (a.length < q.m && a.push(i)) : a.splice(k, 1); answers[cur] = a; }
    else answers[cur] = [i];
    render();
  }
  function toggleFlag() { flags[cur] = !flags[cur]; render(); }
  function nextFlagged() {
    const list = flaggedList(); if (!list.length) return;
    go(list.find((i) => i > cur) ?? list[0]);
  }
  function finish(timeUp) {
    const unanswered = QS.length - QS.filter((_, i) => isDone(i)).length, flagged = flaggedList().length;
    if (!timeUp) {
      const notes = [unanswered && `${unanswered} unanswered`, flagged && `${flagged} flagged`].filter(Boolean).join(', ');
      if (notes && !confirm(`${notes}. Submit anyway?`)) return;
    }
    document.getElementById('mTitle').textContent = timeUp ? '⏱ Time is up' : 'Submitted';
    document.getElementById('mBody').textContent = timeUp
      ? `45 minutes are over, so your exam was submitted automatically (${QS.length - unanswered}/${QS.length} answered).`
      : 'In the app this opens the results page.';
    document.getElementById('overlay').classList.add('show');
  }
  function demoFill() {
    [0, 1, 2, 3, 5, 6, 9, 10, 13].forEach((i) => { answers[i] = [0]; });
    [3, 7, 15].forEach((i) => { flags[i] = true; });
    render();
  }

  render(); renderTimer();
  timerId = setInterval(tick, 1000);
</script>
</body>
</html>
