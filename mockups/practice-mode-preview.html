<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Mode Preview</title>
<style>
  :root {
    --navy: #1a2744; --navy-mid: #243460; --navy-light: #2e4080;
    --gold: #c9a84c; --gold-light: #e8c97a;
    --green: #2d6a4f; --green-light: #52b788;
    --red: #922b21; --red-light: #e74c3c;
    --purple: #6b3fa0; --purple-light: #9b6dca;
    --orange: #d9822b;
    --bg: #f0f2f7; --card: #ffffff; --text: #1a2744; --text-muted: #5a6a8a; --border: #dde2f0;
    --radius: 14px; --shadow: 0 4px 24px rgba(26,39,68,0.10); --shadow-sm: 0 2px 8px rgba(26,39,68,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .mock-bar { background: #3a2a0a; color: #fff; padding: 10px 16px; font-size: 12px; line-height: 1.5; position: sticky; top: 0; z-index: 5; }
  .mock-bar b { color: var(--gold-light); }
  .mock-tab { margin: 6px 6px 0 0; background: transparent; border: 1.5px solid rgba(255,255,255,0.35); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .mock-tab.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .note { font-size: 11.5px; color: #9a7a22; background: #fffbea; border: 1px dashed var(--gold); border-radius: 8px; padding: 8px 10px; margin: 0 0 14px; line-height: 1.55; }
  .screen { display: none; } .screen.on { display: block; }
  .app-head { background: var(--navy); color: #fff; padding: 12px 16px; font-weight: 800; font-size: 15px; }
  .bm { width: 18px; height: 18px; vertical-align: -3px; }
  .bm path { fill: var(--orange); stroke: var(--orange); stroke-width: 2; stroke-linejoin: round; }
  .bm.line path { fill: none; stroke: var(--text-muted); }

  /* ── HOME ── */
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; }
  /* NEW: "My review" — sets built from what the user has done (separate from the question categories) */
  .my-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .my-tile { position: relative; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 12px 12px 11px; text-align: left; cursor: pointer; box-shadow: var(--shadow-sm); }
  .my-tile .t-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .my-tile .t-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; }
  .my-tile.wrong .t-icon { background: #fdf0ef; color: var(--red-light); }
  .my-tile.flagged .t-icon { background: #fdf3e8; }
  .my-tile .t-icon .bm { width: 17px; height: 17px; }
  .my-tile .t-num { font-size: 24px; font-weight: 900; color: var(--navy); line-height: 1; }
  .my-tile b { display: block; font-size: 13.5px; color: var(--navy); }
  .my-tile span.sub { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
  .my-tile.wrong { border-left: 4px solid var(--red-light); }
  .my-tile.flagged { border-left: 4px solid var(--orange); }
  .my-tile.empty { cursor: default; opacity: 0.6; border-left-color: var(--border); box-shadow: none; }
  .my-note { font-size: 11px; color: var(--text-muted); margin-bottom: 22px; }
  .round-note { display: inline-block; text-transform: none; letter-spacing: 0; background: #fdf0ef; color: var(--red); border-radius: 6px; padding: 2px 7px; font-size: 10.5px; font-weight: 700; margin-top: 6px; }
  .ptabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .ptab { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 9px 2px; font-size: 11.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; }
  .ptab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .ptab .bm { width: 13px; height: 13px; vertical-align: 0; }
  .ptab.on .bm path { fill: #fff; stroke: #fff; }
  .row-btn { position: relative; overflow: hidden; background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .row-btn .stars { color: var(--gold); flex: 1; } .row-btn .stars .off { color: var(--border); }
  .row-btn .nm { font-weight: 700; color: var(--text-muted); font-size: 12px; }
  .row-btn .ct { color: var(--green); font-weight: 700; font-size: 12px; }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--green-light); }
  /* Flagged tab */
  .flag-start { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, var(--navy), var(--navy-mid)); color: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .flag-start .bm { width: 26px; height: 26px; }
  .flag-start b { display: block; font-size: 15px; } .flag-start span { font-size: 12px; color: rgba(255,255,255,0.7); }
  .flag-start .go { margin-left: auto; font-size: 20px; color: var(--gold-light); }
  .flag-item { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
  .flag-item .fi-text { flex: 1; font-size: 13px; color: var(--navy); font-weight: 600; line-height: 1.45; }
  .flag-item small { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .flag-item button { background: none; border: none; cursor: pointer; padding: 2px; }
  .empty-hint { font-size: 12.5px; color: var(--text-muted); text-align: center; padding: 14px; border: 1.5px dashed var(--border); border-radius: 10px; }

  /* ── QUESTION ── */
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .back-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .quiz-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .badge { background: var(--navy); color: var(--gold-light); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; margin-left: 8px; }
  .q-card { position: relative; overflow: hidden; background: var(--card); border-radius: var(--radius); padding: 26px 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .q-progress { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--border); }
  .q-progress div { height: 100%; background: linear-gradient(90deg, var(--green-light), var(--gold)); }
  .q-num { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; min-height: 30px; }
  .q-num-text { flex: 1; display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; white-space: nowrap; }
  .stars { color: var(--gold); font-size: 11px; } .stars .off { color: var(--border); }
  .pill { text-transform: none; letter-spacing: 0; background: #edf8f2; color: var(--green); border-radius: 999px; padding: 2px 7px; font-size: 10.5px; font-weight: 800; }
  .flag-btn { width: 32px; height: 32px; border: none; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .flag-btn svg { width: 24px; height: 24px; }
  .flag-btn path { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linejoin: round; }
  .flag-btn.on path { fill: var(--orange); stroke: var(--orange); }
  .yue-toggle { text-transform: none; letter-spacing: 0; background: #f3eefa; border: 1.5px solid var(--purple-light); color: var(--purple); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: var(--navy); font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.5; color: var(--navy); }
  .q-yue { margin-top: 10px; padding: 10px 12px; background: #f7f4fc; border-left: 3px solid var(--purple-light); border-radius: 0 8px 8px 0; color: var(--purple); font-size: 14px; }
  .opt { background: var(--card); border: 2px solid var(--border); border-radius: 11px; padding: 13px 16px; font-size: 14px; display: flex; gap: 12px; margin-bottom: 10px; }
  .opt-letter { min-width: 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .opt.correct { border-color: var(--green-light); background: #edf8f2; } .opt.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red-light); background: #fdf0ef; } .opt.wrong .opt-letter { background: var(--red-light); border-color: var(--red-light); color: #fff; }

  /* ── RESULT ── */
  .result-card { background: var(--card); border-radius: var(--radius); padding: 26px 22px 20px; text-align: center; box-shadow: var(--shadow); margin-bottom: 20px; }
  .result-emoji { font-size: 46px; }
  .result-score { font-size: 46px; font-weight: 900; color: var(--navy); line-height: 1; margin-top: 8px; }
  .result-score span { font-size: 22px; font-weight: 500; color: var(--text-muted); }
  .result-sub { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .rdots-wrap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .rdots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .rdot { aspect-ratio: 1; width: 100%; max-width: 30px; justify-self: center; border-radius: 50%; border: 2px solid transparent; font-size: 10.5px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; }
  .rdot.ok { background: var(--green-light); border-color: var(--green-light); } .rdot.bad { background: var(--red-light); border-color: var(--red-light); }
  .rdot.flag { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--orange); }
  .rmeta { display: flex; justify-content: flex-end; gap: 5px; margin-top: 10px; font-size: 10px; color: var(--text-muted); white-space: nowrap; flex-wrap: wrap; }
  .rmeta .sep { color: var(--border); } .rmeta i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
  .chips { display: flex; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip .bm { width: 13px; height: 13px; vertical-align: 0; }
  .review-item { background: var(--card); border-radius: 10px; padding: 16px 18px; border-left: 4px solid var(--green-light); font-size: 13px; line-height: 1.55; margin-bottom: 12px; }
  .review-item.bad { border-color: var(--red-light); }
  .rv-q { font-weight: 600; color: var(--navy); margin-bottom: 8px; }
  .rv-your { color: var(--text-muted); font-size: 12.5px; margin-bottom: 4px; }
  .rv-ans { color: var(--green); font-size: 12.5px; font-weight: 600; }
  .rv-tr { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); color: var(--purple); font-size: 12.5px; }
  .streak { font-size: 11px; color: var(--text-muted); font-weight: 700; float: right; }
  .nav-row { display: flex; gap: 10px; justify-content: flex-end; margin: 6px 0 16px; }
  .nav-btn { background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: 14px; font-weight: 700; }
  .nav-btn.secondary { background: var(--card); color: var(--navy); border: 2px solid var(--border); }
</style>
</head>

<script>
  const QS = [{"id":"4.0","q":"What was the last battle between Great Britain and France?","o":["The Battle of Trafalgar","The Battle of Waterloo","The Battle of Hastings","The Battle of Agincourt"],"oy":["特拉法加海戰","滑鐵盧戰役","黑斯廷斯戰役","阿金庫爾戰役"],"a":[1],"d":1,"yue":"英法兩國最後一場戰役係乜嘢？","note":"記憶法（英國重要戰役，按年份）：\n• 9 世紀 → vs Vikings（維京人）→ Alfred the Great（阿爾弗雷德大帝）統一盎格魯-撒克遜王國 → 打敗維京人；\n• 1066 → vs Normandy（諾曼第）→ Battle of Hastings（黑斯廷斯戰役）→ William of Normandy（諾曼第公爵威廉）打敗 Harold → 英格蘭戰敗，諾曼征服；\n• 1314 → vs Scotland（蘇格蘭）→ Battle of Bannockburn（班諾克本戰役）→ Robert the Bruce 打敗英格蘭 → 蘇格蘭保持獨立；\n• 1588 → vs Spain（西班牙）→ Spanish Armada（西班牙無敵艦隊）→ Elizabeth I 年代英格蘭擊敗西班牙；\n• 1805 → vs France（法國）+ Spain（西班牙）→ Battle of Trafalgar（特拉法加海戰）→ Admiral Nelson（納爾遜）打敗法西聯合艦隊 → Nelson 陣亡；\n• 1815 → vs France（法國）→ Battle of Waterloo（滑鐵盧戰役）→ Duke of Wellington（威靈頓公爵）打敗 Napoleon → 英法最後一戰；\n• 1940 → vs Germany（德國）→ Battle of Britain（不列顛戰役）→ 皇家空軍擊退德國空襲 → 阻止德國入侵。"},{"id":"4.1","q":"Which flower is associated with Wales?","o":["Daffodil","Rose","Shamrock","Thistle"],"oy":["水仙花","玫瑰","三葉草","薊花"],"a":[0],"d":2,"yue":"哪種花與威爾斯有關？","note":"記憶法：\nThistle（薊花）→ Scotland（蘇格蘭）；\nTudor rose（都鐸玫瑰）→ England（英格蘭）；\nDaffodil（水仙花）→ Wales（威爾斯）；\nShamrock（三葉草）→ Northern Ireland（北愛爾蘭）。"},{"id":"4.2","q":"During the reign of Charles II, parts of London were destroyed by:","o":["A war","A flood","A fire","An earthquake"],"oy":["一場戰爭","水災","火災","地震"],"a":[2],"d":3,"yue":"查理二世年代，倫敦部分地區被摧毀，原因係：","note":"1666年倫敦大火，包括聖保羅大教堂"},{"id":"4.3","q":"How often are general elections held in the UK?","o":["Every 3 years","Every 4 years","Every 5 years","Every 10 years"],"oy":["每3年","每4年","每5年","每10年"],"a":[2],"d":2,"yue":"英國大選多久舉行一次？","note":"記憶法：\n650 個選區（constituency）→ 每區選 1 位國會議員（Member of Parliament, MP）→ 下議院共 650 位 MP；\n大選（general election）→ 每 5 年一次；\nMP 中途去世或辭職 → 補選（by-election）。"},{"id":"4.4","q":"Scotland has its own banknotes, which are valid everywhere in the UK. True or False?","o":["True","False"],"oy":["",""],"a":[0],"d":5,"yue":"蘇格蘭有自己 al garden in London","A science museum in Bristol"],"oy":["康沃爾嘅旅遊景點，有巨型溫室生態館","德文郡嘅國家公園","倫敦嘅王室花園","布里斯托嘅科學博物館"],"a":[0],"d":3,"yue":"伊甸園計劃係乜嘢？","note":""},{"id":"4.19","q":"What do Members of the House of Lords do?","o":["Write new laws independently","Examine and revise laws proposed by the House of Commons","Manage local councils","Appoint judges"],"oy":["獨立撰寫新法律","審議同修訂下議院提出嘅法案","管理地方議會","任命法官"],"a":[1],"d":1,"yue":"上議院議員做乜嘢？","note":"上議院不能拒絕財政法案"},{"id":"4.20","q":"The National Assembly for Wales is located in which city?","o":["Swansea","Cardiff","Newport","Bangor"],"oy":["史雲斯","加的夫","紐波特","班戈"],"a":[1],"d":4,"yue":"威爾斯國民議會位於哪個城市？","note":""},{"id":"4.21","q":"Who wrote 'Pride and Prejudice'?","o":["Charlotte Brontë","George Eliot","Jane Austen","Thomas Hardy"],"oy":["夏綠蒂·勃朗特","喬治·艾略特","珍·奧斯汀","哈代"],"a":[2],"d":2,"yue":"《傲慢與偏見》係誰寫嘅？","note":""},{"id":"4.22","q":"What happened during the Blitz?","o":["A German land invasion","Germany bombed British cities during WWII","The Battle of Britain air fight","British bombing of Berlin"],"oy":["德國陸上入侵","二戰期間德國轟炸英國城市","不列顛空戰","英國轟炸柏林"],"a":[1],"d":3,"yue":"倫敦大轟炸（Blitz）發生了什麼事？","note":"1940–1941年"},{"id":"4.23","q":"Who is referred to as the Iron Duke?","o":["Oliver Cromwell","The Duke of Wellington","Winston Churchill","Admiral Nelson"],"oy":["克倫威爾","威靈頓公爵","邱吉爾","納爾遜上將"],"a":[1],"d":1,"yue":"「鐵公爵」係指誰？","note":"打敗拿破崙的名將"}];
  const BM = 'M7.5 3.5h9A2.5 2.5 0 0 1 19 6v14.5l-7-5.1-7 5.1V6a2.5 2.5 0 0 1 2.5-2.5z';
  const bm = (cls = '') => `<svg class="bm ${cls}" viewBox="0 0 24 24"><path d="${BM}"/></svg>`;
  const stars = d => '★'.repeat(d) + `<span class="off">${'★'.repeat(5 - d)}</span>`;
  // sample state: persistent flags + wrong list
  const flags = new Set([1, 2, 12, 16, 22]);
  let wrongCount = 14;
  const ROUND_MAX = 24;
  const SCREENS = [
    { key: 'home', tab: '① Home' },
    { key: 'homeBig', tab: '② Home · 38 錯題' },
    { key: 'homeEmpty', tab: '③ Home · 未有記錄' },
    { key: 'question', tab: '④ Question' },
    { key: 'result', tab: '⑤ Result (wrong review)' },
  ];
  let screen = 'home';

  function myReview(wrongN, flagN) {
    const wrongSub = !wrongN ? 'Nothing to review yet'
      : wrongN > ROUND_MAX ? `${wrongN} to clear · ${ROUND_MAX} per round` : `${wrongN} to clear`;
    const flagSub = !flagN ? 'Tap 🔖 on a question to save it' : `${flagN} saved`;
    return `
      <div class="section-title">My Review</div>
      <div class="my-grid">
        <div class="my-tile wrong${wrongN ? '' : ' empty'}" ${wrongN ? `onclick="go('question')"` : ''}>
          <div class="t-top"><span class="t-icon">✗</span><span class="t-num">${wrongN}</span></div>
          <b>Wrong answers</b><span class="sub">${wrongSub}</span>
        </div>
        <div class="my-tile flagged${flagN ? '' : ' empty'}" ${flagN ? `onclick="go('question')"` : ''}>
          <div class="t-top"><span class="t-icon">${bm()}</span><span class="t-num">${flagN}</span></div>
          <b>Flagged</b><span class="sub">${flagSub}</span>
        </div>
      </div>
      <div class="my-note">Wrong answers come from Practice and Exam, and clear when you get them right here. Up to ${ROUND_MAX} per round.</div>`;
  }
  function categories() {
    const diff = [['Easy', 84, 31], ['Basic', 91, 22], ['Medium', 148, 30], ['Hard', 66, 14], ['Expert', 19, 6]];
    return `
      <div class="section-title">Practice by</div>
      <div class="ptabs"><button class="ptab on">Difficulty</button><button class="ptab">Chapter</button><button class="ptab">Exam</button></div>
      ${diff.map(([n, t, m], i) => `<div class="row-btn"><span class="stars">${stars(i + 1)}</span><span class="nm">${n}</span><span class="ct">${m}/${t} · ${Math.round(m / t * 100)}%</span><span class="bar" style="width:${Math.round(m / t * 100)}%"></span></div>`).join('')}`;
  }
  function home() {
    return `<div class="note">「My Review」自成一區（做過先有）：Wrong answers / Flagged 兩格，撳就開始練；下面「Practice by」先係題目本身嘅分類（Difficulty / Chapter / Exam）。</div>`
      + myReview(14, flags.size) + categories();
  }
  function homeBig() {
    return `<div class="note">錯題多過 24 題：格仔寫「38 to clear · 24 per round」，每輪抽 24 題，答啱先會清走。</div>`
      + myReview(38, flags.size) + categories();
  }
  function homeEmpty() {
    return `<div class="note">新用戶 / 冇錯題同 flag：兩格變灰、撳唔到，寫提示。</div>` + myReview(0, 0) + categories();
  }
  function question() {
    const i = 2, q = QS[i], picked = q.o.findIndex((_, k) => !q.a.includes(k));
    return `
      <div class="note">練錯題途中：Practice 問題卡加書籤（喺 Translate／← → 左邊），flag 長期保存。標題下面寫埋今輪係錯題清單嘅邊部分。</div>
      <div class="quiz-header"><span class="back-btn">← Home</span><span><span class="quiz-label">Wrong answers</span><span class="badge">Practice</span></span></div>
      <div class="q-card">
        <div class="q-progress"><div style="width:21%"></div></div>
        <div class="q-num">
          <span class="q-num-text"><span>Question 3 of 24</span><span class="stars">${stars(q.d)}</span><span class="pill">✓ 1/3</span></span>
          <button class="flag-btn ${flags.has(i) ? 'on' : ''}" onclick="flags.has(${i})?flags.delete(${i}):flags.add(${i});render()" title="Flag"><svg viewBox="0 0 24 24"><path d="${BM}"/></svg></button>
          <span class="icon-btn">←</span><span class="icon-btn primary">→</span>
        </div>
        <div class="q-text">${q.q}</div><div class="q-yue">${q.yue}</div>
        <div class="round-note">Round 1 of 2 · 24 of your 38 wrong answers</div>
      </div>
      ${q.o.map((o, k) => `<div class="opt ${q.a.includes(k) ? 'correct' : k === picked ? 'wrong' : ''}"><span class="opt-letter">${'ABCD'[k]}</span><span>${o}</span></div>`).join('')}`;
  }
  function result() {
    const W = [2, 6, 9, 14, 19, 21], ok = 24 - W.length;
    const dot = i => `<span class="rdot ${W.includes(i) ? 'bad' : 'ok'}${flags.has(i) ? ' flag' : ''}">${i + 1}</span>`;
    return `
      <div class="note">Practice 結果頁跟 Exam 版：🎯 icon、分數只顯示一次（冇 PASSED、唔變紅）、結果圓點、All / Wrong / Flagged filter。練錯題嗰輪：副標題講清走咗幾多、仲剩幾多（下一輪）。</div>
      <div class="quiz-header"><span class="back-btn">← Home</span><span class="quiz-label">Wrong answers</span></div>
      <div class="result-card">
        <div class="result-emoji">🎯</div>
        <div class="result-score">${ok} <span>/ 24 · ${Math.round(ok / 24 * 100)}%</span></div>
        <div class="result-sub">Cleared 18 from your wrong list · 20 left (next round)</div>
        <div class="rdots-wrap"><div class="rdots">${QS.map((_, i) => dot(i)).join('')}</div>
          <div class="rmeta"><span><i style="background:var(--green-light)"></i>Correct <b>${ok}</b></span><span class="sep">|</span><span><i style="background:var(--red-light)"></i>Wrong <b>${W.length}</b></span><span class="sep">|</span><span><i style="box-shadow:0 0 0 2px var(--orange)"></i>Flagged <b>${flags.size}</b></span></div></div>
      </div>
      <div class="nav-row"><button class="nav-btn secondary">Retry</button><button class="nav-btn">Another Practice</button></div>
      <div class="section-title">Review Answers</div>
      <div class="chips"><span class="chip on">All <b>24</b></span><span class="chip">Wrong <b>${W.length}</b></span><span class="chip">${bm()}Flagged <b>${flags.size}</b></span></div>
      ${[0, 2].map(i => `<div class="review-item ${W.includes(i) ? 'bad' : ''}"><div class="rv-q">${i + 1}. ${QS[i].q} ${flags.has(i) ? bm() : ''}<span class="streak">${W.includes(i) ? '🔥 0/3' : '🔥 2/3'}</span></div>${W.includes(i) ? `<div class="rv-your">Your answer: ${QS[i].o.find((_, k) => !QS[i].a.includes(k))}</div>` : ''}<div class="rv-ans">✅ ${QS[i].a.map(k => QS[i].o[k]).join(' | ')}</div><div class="rv-tr">【廣東話】${QS[i].yue}</div></div>`).join('')}`;
  }
  const VIEWS = { home, homeBig, homeEmpty, question, result };
  function go(s) { screen = s; render(); scrollTo(0, 0); }
  function render() {
    document.getElementById('screenTabs').innerHTML = SCREENS.map(s => `<button class="mock-tab ${s.key === screen ? 'on' : ''}" onclick="go('${s.key}')">${s.tab}</button>`).join('');
    document.getElementById('app').innerHTML = VIEWS[screen]();
  }
  render();
</script>
