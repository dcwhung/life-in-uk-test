// copy of js/components/tags.js noteLineHtml / noteHtml / noteTableHtml / noteCellHtml (v1.0.8)
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NOTE_MARK = /^([•◦→])\s*/;
function noteLineHtml(line) {
  const text = line.trim(), mark = text.match(NOTE_MARK);
  // PROPOSED (5B, option A): 8+ leading spaces and no marker = continuation line, aligned with the text after a sub item's "→"
  const cls = (/^\s{8,}/.test(line) && !mark) ? ' cont' : /^\s{2,}/.test(line) ? ' sub' : mark ? ' bullet' : '';
  const body = mark ? `<span class="note-mark">${mark[1]} </span>${escapeHtml(text.slice(mark[0].length))}` : escapeHtml(text);
  return `<div class="rv-note-line${cls}" lang="zh-HK">${body}</div>`;
}
const NOTE_TABLE_ROW = /^\s*\|/;
const NOTE_CELL_BREAK = '<br>';
const NOTE_GAP_HTML = '<div class="rv-note-gap"></div>';
function noteHtml(note) {
  const out = [];
  let rows = [];
  const flushTable = () => { if (rows.length) out.push(noteTableHtml(rows)); rows = []; };
  for (const line of note.split('\n')) {
    if (NOTE_TABLE_ROW.test(line)) { rows.push(line); continue; }
    flushTable();
    out.push(line.trim() ? noteLineHtml(line) : NOTE_GAP_HTML);
  }
  flushTable();
  return out.join('');
}
function noteTableHtml(rows) {
  const [head, ...body] = rows.map(row => row.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim()));
  const rowHtml = (cells, tag) => `<tr>${cells.map(cell => noteCellHtml(cell, tag)).join('')}</tr>`;
  return `<div class="note-table-wrap"><table class="note-table" lang="zh-HK"><thead>${rowHtml(head, 'th')}</thead>`
    + `<tbody>${body.map(cells => rowHtml(cells, 'td')).join('')}</tbody></table></div>`;
}
function noteCellHtml(cell, tag) {
  const [main, ...remarks] = cell.split(NOTE_CELL_BREAK);
  if (!remarks.length) return `<${tag}>${escapeHtml(cell)}</${tag}>`;
  // PROPOSED (N20): a remark starting with "•" = bullet line, indented with a hanging indent
  const subs = remarks.map(remark => `<span class="note-cell-sub${/^•\s/.test(remark) ? ' bullet' : ''}">${escapeHtml(remark)}</span>`).join('');
  return `<${tag} class="multi">${escapeHtml(main)}${subs}</${tag}>`;
}

const box = ([cls, label, flag, note], q) => `<div class="phone ${cls}"><h2>${escapeHtml(label)}</h2><p class="flag">${escapeHtml(flag)}</p>
  <div class="answer-box"><p class="q">${escapeHtml(q)}</p><div class="ans-label">✓ Correct</div>
  <div class="ans-note" lang="zh-HK"><strong>💡 備注：</strong><div class="ans-note-text">${noteHtml(note)}</div></div></div></div>`;
document.getElementById('groups').innerHTML = GROUPS.map(([title, why, q, boxes]) =>
  `<section class="group"><h2 class="group-title">${escapeHtml(title)}</h2><p class="group-why">${escapeHtml(why)}</p>
   <div class="row">${boxes.map(b => box(b, q)).join('')}</div></section>`).join('');
</script>
