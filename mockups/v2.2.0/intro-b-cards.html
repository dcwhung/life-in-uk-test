<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B · 輕鬆卡片</title>
<link rel="stylesheet" href="intro-shared.css">
<style>
  /* ══ 方案 B — Friendly: light background, card stack + mini UI illustrations (rev 2: user feedback 2026-10-13) ══ */
  :root {
    /* proposed tokens (option B): one tint per intro page */
    --b-tint-1: var(--success-bg); --b-ink-1: var(--green);
    --b-tint-2: var(--selected-bg); --b-ink-2: var(--navy-light);
    --b-tint-3: var(--yue-bg); --b-ink-3: var(--purple);
    --b-note-tape: rgba(201,168,76,0.45);
    --b-card-tilt: -2deg;
    /* copied from css/base/tokens.css (study plan heat scale + flag) */
    --flag-bg: #fdf3e8; --red-light: #e74c3c;
    --plan-heat-0: #e3e7f1; --plan-heat-1: #e8735f; --plan-heat-2: #f0a54a; --plan-heat-3: #c9cf4f; --plan-heat-4: var(--green-light);
    --fs-2xs: 10px; --fs-3xs: 9px;
  }
  .loading, .intro { background: var(--bg); color: var(--text); }

  /* ── Loading ── */
  .b-load { height: 100%; display: grid; place-content: center; justify-items: center; gap: var(--space-8); padding: var(--space-12); text-align: center; }
  .b-logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: var(--shadow-md); animation: bPop .6s var(--intro-ease) both; }
  @keyframes bPop { from { transform: scale(.6); opacity: 0; } }
  .b-name { font-size: var(--fs-5xl); font-weight: 800; }
  .b-sub { font-size: var(--fs-md); color: var(--text-muted); margin-top: calc(var(--space-6) * -1); }
  .b-dots { display: flex; gap: var(--space-3); }
  .b-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); animation: bBounce 1s ease-in-out infinite; }
  .b-dots i:nth-child(2) { background: var(--navy-light); animation-delay: .15s; }
  .b-dots i:nth-child(3) { background: var(--green-light); animation-delay: .3s; }
  @keyframes bBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
  .b-note { position: relative; width: 300px; background: var(--gold-bg); border-radius: var(--radius-xs); padding: var(--space-10) var(--space-8) var(--space-8);
    box-shadow: var(--shadow-md); transform: rotate(var(--b-card-tilt)); text-align: left; font-size: var(--fs-md); line-height: 1.6; margin-top: var(--space-8); }
  .b-note::before { content: ''; position: absolute; top: -10px; left: 50%; width: 80px; height: 22px; transform: translateX(-50%) rotate(3deg); background: var(--b-note-tape); }
  .b-note b { display: block; font-size: var(--fs-sm); color: var(--orange); margin-bottom: var(--space-2); }

  /* ── Intro ── */
  .b-intro { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: var(--space-6) var(--space-8) var(--space-12); gap: var(--space-6); }
  .b-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
  .b-step { font-size: var(--fs-sm); font-weight: 800; color: var(--text-muted); letter-spacing: .08em; }
  .b-skip { min-height: 44px; padding: 0 var(--space-4); color: var(--text-muted); font-weight: 700; font-size: var(--fs-md); }
  .b-stack { position: relative; margin-bottom: 30px; touch-action: pan-y; }
  .b-card { position: absolute; inset: 0; background: var(--card); border-radius: 24px; box-shadow: var(--shadow-md); display: grid; grid-template-rows: auto 1fr;
    overflow: hidden; transition: transform var(--intro-dur) var(--intro-ease), opacity var(--intro-dur) var(--intro-ease); }
  .b-card[data-pos="1"] { transform: translateY(18px) scale(.94); opacity: .75; }
  .b-card[data-pos="2"] { transform: translateY(34px) scale(.88); opacity: .45; }
  .b-card[data-pos="out"] { transform: translateX(-120%) rotate(-12deg); opacity: 0; pointer-events: none; }
  .b-card[data-pos="hide"] { opacity: 0; pointer-events: none; }
  .b-art { height: 268px; display: grid; place-items: center; position: relative; overflow: hidden; }
  .b-card.p1 .b-art { background: var(--b-tint-1); --ink: var(--b-ink-1); }
  .b-card.p2 .b-art { background: var(--b-tint-2); --ink: var(--b-ink-2); }
  .b-card.p3 .b-art { background: var(--b-tint-3); --ink: var(--b-ink-3); height: 252px; }
  .b-card.p2 .b-art { height: 318px; }
  .b-card.p2 .ui { gap: var(--space-3); }
  .b-card.p2 .ui-card { gap: var(--space-2); padding: var(--space-4) var(--space-6); }
  .b-text { padding: var(--space-6) var(--space-10) var(--space-8); display: grid; align-content: start; gap: var(--space-4); overflow: auto; }
  .b-kicker { justify-self: start; font-size: var(--fs-sm); font-weight: 800; padding: var(--space-1) var(--space-5); border-radius: var(--radius-pill); color: var(--card); }
  .p1 .b-kicker { background: var(--b-ink-1); } .p2 .b-kicker { background: var(--b-ink-2); } .p3 .b-kicker { background: var(--b-ink-3); }
  .b-title { font-size: var(--fs-6xl); font-weight: 800; line-height: 1.3; }
  .b-body { font-size: var(--fs-md); line-height: 1.65; color: var(--text-muted); }
  .b-list { list-style: none; display: flex; flex-wrap: wrap; gap: var(--space-3); }
  .b-list li { font-size: var(--fs-sm); font-weight: 700; padding: var(--space-2) var(--space-5); border-radius: var(--radius-pill); background: var(--bg); }
  .p3 .b-list { display: none; }  /* last card needs the room for the settings */

  /* footer: dots above the button (feedback: swipe + dots back) */
  .b-foot { display: grid; gap: var(--space-6); }
  .b-pager { display: flex; align-items: center; justify-content: center; gap: var(--space-6); }
  .b-pager .nav { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-muted); }
  .b-pager .nav svg { width: 18px; height: 18px; }
  .b-pager .nav[disabled] { opacity: .25; cursor: default; }
  .b-dotrow { display: flex; gap: var(--space-4); }
  .b-dotrow button { width: 9px; height: 9px; border-radius: var(--radius-pill); background: var(--border); transition: width var(--intro-dur) var(--intro-ease), background .2s; }
  .b-dotrow button[aria-current="true"] { width: 26px; background: var(--navy); }
  .b-swipe { font-size: var(--fs-xs); color: var(--text-muted); text-align: center; margin-top: calc(var(--space-4) * -1); }
  .b-next { min-height: 52px; border-radius: var(--radius); background: var(--navy); color: var(--text-inverse); font-weight: 800; font-size: var(--fs-lg); }
  .b-ctas { display: grid; gap: var(--space-4); }
  .b-ctas .b-alt { min-height: 48px; border-radius: var(--radius); background: var(--card); border: 1.5px solid var(--border); font-weight: 800; font-size: var(--fs-md); }
  .b-ctas[hidden], .b-next[hidden] { display: none; }

  /* ── mini UI (same parts as the app: .stars, bookmark, .opt-letter, .exam-timer, plan heat) ── */
  .ui { position: relative; width: 318px; display: grid; gap: var(--space-4); font-size: var(--fs-sm); }
  .ui-card { background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-5) var(--space-6); display: grid; gap: var(--space-3); }
  .stars { color: var(--gold); letter-spacing: 1px; font-size: var(--fs-sm); white-space: nowrap; }
  .stars .off { color: var(--border); }
  .bm { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1.5px solid var(--orange); background: var(--flag-bg); color: var(--orange); display: grid; place-items: center; flex: none; }
  .bm svg { width: 16px; height: 16px; } .bm path { fill: currentColor; }
  .bm.off { border-color: var(--border); background: var(--card); color: var(--text-muted); } .bm.off path { fill: none; stroke: currentColor; stroke-width: 2; }
  .row { display: flex; align-items: center; gap: var(--space-4); }
  .row .sp { flex: 1; }
  .tag { font-size: var(--fs-2xs); font-weight: 800; padding: 1px var(--space-3); border-radius: var(--radius-pill); background: var(--bg); color: var(--text-muted); }
  .muted { color: var(--text-muted); }

  /* P1: five study tabs + fact card */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-2); background: var(--card); border-radius: var(--radius-md); padding: var(--space-2); box-shadow: var(--shadow-sm); }
  .tabs span { display: grid; justify-items: center; gap: 1px; padding: var(--space-2) 0; border-radius: var(--radius-xs); font-size: var(--fs-2xs); font-weight: 700; color: var(--text-muted); transition: background .3s, color .3s; }
  .tabs span i { font-style: normal; font-size: var(--fs-lg); }
  .tabs span.on { background: var(--ink); color: var(--card); }
  .fact-q { font-size: var(--fs-md); font-weight: 800; line-height: 1.4; }
  .fact-a { color: var(--green); font-weight: 700; }
  .lv { display: flex; gap: 3px; } .lv i { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--border); } .lv i.on { background: var(--ink); }

  /* P2: question card with A–D + mode chips with timer */
  .q-head { display: flex; align-items: center; gap: var(--space-4); font-weight: 800; font-size: var(--fs-xs); color: var(--text-muted); }
  .q-text { font-size: var(--fs-base); font-weight: 800; line-height: 1.35; }
  .opt { display: flex; align-items: center; gap: var(--space-4); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 3px var(--space-4); font-size: var(--fs-sm); font-weight: 600; }
  .opt-letter { min-width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--border); display: grid; place-items: center; font-size: var(--fs-2xs); font-weight: 800; }
  .opt.correct { border-color: var(--green-light); background: var(--success-bg); color: var(--green); }
  .opt.correct .opt-letter { background: var(--green); border-color: var(--green); color: var(--card); }
  .opt.wrong { border-color: var(--red-light); background: var(--danger-bg); color: var(--red); }
  .opt.wrong .opt-letter { background: var(--red-light); border-color: var(--red-light); color: var(--card); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .mode { background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-4) var(--space-5); display: flex; align-items: center; gap: var(--space-4); font-weight: 800; font-size: var(--fs-sm); }
  .mode .ic { width: 30px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: var(--fs-lg); background: var(--bg); }
  .mode small { display: block; font-size: var(--fs-2xs); color: var(--text-muted); font-weight: 600; }
  .exam-timer { display: inline-flex; align-items: center; background: var(--navy); color: var(--text-inverse); border-radius: var(--radius-pill); padding: 2px var(--space-4);
    font-size: var(--fs-2xs); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* P3: plan card (countdown, week heat, today's tasks, ring) + translation card */
  .plan-grid { display: grid; grid-template-columns: 1fr auto; gap: var(--space-4); align-items: start; }
  .countdown b { font-size: var(--fs-5xl); line-height: 1; color: var(--ink); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .week span { display: grid; justify-items: center; gap: 2px; font-size: var(--fs-3xs); color: var(--text-muted); }
  .week span i { width: 100%; height: 14px; border-radius: 3px; background: var(--plan-heat-0); }
  .week .h1 i { background: var(--plan-heat-1); } .week .h2 i { background: var(--plan-heat-2); } .week .h3 i { background: var(--plan-heat-3); } .week .h4 i { background: var(--plan-heat-4); }
  .week .today { color: var(--ink); font-weight: 800; } .week .today i { outline: 2px solid var(--ink); outline-offset: 1px; }
  .ring { width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(var(--green-light) calc(var(--p, 0) * 1%), var(--plan-heat-0) 0); display: grid; place-items: center; }
  .ring b { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: var(--fs-sm); }
  .task { display: flex; align-items: center; gap: var(--space-3); font-size: var(--fs-xs); }
  .task i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; font-style: normal; font-size: var(--fs-3xs); color: var(--card); flex: none; }
  .task.done i { background: var(--green-light); border-color: var(--green-light); }
  .task.done span { color: var(--text-muted); text-decoration: line-through; }
  .yue { display: flex; align-items: flex-start; gap: var(--space-4); }
  .yue .badge { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--card); font-weight: 800; display: grid; place-items: center; flex: none; font-size: var(--fs-sm); }
  .yue p { font-size: var(--fs-xs); line-height: 1.45; } .yue p span { display: block; color: var(--purple); }
  .float { animation: bFloat 3s ease-in-out infinite; }
  @keyframes bFloat { 50% { transform: translateY(-4px); } }

  /* last-page settings */
  .set { display: grid; gap: var(--space-2); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); min-height: 44px; font-size: var(--fs-md); }
  .set-row small { display: block; font-size: var(--fs-xs); color: var(--text-muted); }
  .set-seg { display: inline-flex; background: var(--bg); border-radius: var(--radius-pill); padding: var(--space-1); }
  .set-seg button { min-width: 56px; min-height: 34px; border-radius: var(--radius-pill); font-weight: 700; color: var(--text-muted); }
  .set-seg button[aria-pressed="true"] { background: var(--card); color: var(--navy); box-shadow: var(--shadow-sm); }
  .set-hint { font-size: var(--fs-xs); color: var(--text-muted); }
  .p3 .b-title { font-size: var(--fs-5xl); }

  /* ── PC ── */
  .is-pc .b-load { grid-template-columns: auto auto; column-gap: 64px; align-items: center; text-align: left; justify-items: start; }
  .is-pc .b-load > :not(.b-note) { grid-column: 1; }
  .is-pc .b-load .b-note { grid-column: 2; grid-row: 1 / span 4; margin: 0; width: 340px; }
  .is-pc .b-sub { margin-top: 0; }
  .is-pc .b-intro { width: 980px; justify-self: center; padding: 32px 0 40px; }
  .is-pc .b-card { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
  .is-pc .b-art, .is-pc .b-card.p2 .b-art, .is-pc .b-card.p3 .b-art { height: auto; }
  .is-pc .ui { transform: scale(1.22); }
  .is-pc .b-text { padding: 40px; align-content: center; }
  .is-pc .b-title { font-size: var(--fs-display-sm); }
  .is-pc .p3 .b-title { font-size: var(--fs-7xl); }
  .is-pc .b-body { font-size: var(--fs-lg); }
  .is-pc .b-foot { grid-template-columns: 1fr auto; align-items: center; }
  .is-pc .b-pager { justify-content: flex-start; }
  .is-pc .b-swipe { display: none; }
  .is-pc .b-next { padding: 0 48px; }
  .is-pc .b-ctas { grid-auto-flow: column; justify-content: end; }
  .is-pc .b-ctas button { padding: 0 32px; }
</style>
</head>
<body>
<script src="intro-shared.js"></script>
<script>
(() => {
  const PAGE_COUNT = 3;
  const TAB_CYCLE_MS = 1400;
  const TIMER_START_S = 45 * 60;
  const SECOND_MS = 1000;
  const RING_PCT = 65;
  const BOOKMARK_PATH = 'M7.5 3.5h9A2.5 2.5 0 0 1 19 6v14.5l-7-5.1-7 5.1V6a2.5 2.5 0 0 1 2.5-2.5z'; // js/components/icons.js
  const MAX_DIFFICULTY = 5;
  let page = 0;

  // option-B-only strings (illustration labels); app wording from locales/*.js
  const ART = {
    zh: { tabs: ['章節', '時間線', '地理', '人物', '記憶法'], tabIcons: ['📚', '⏳', '🗺️', '👤', '🧠'],
      factQ: '《大憲章》於哪一年簽署？', factA: '1215 年 — 限制了國王的權力', memoLv: '記憶法 Lv2',
      qNum: '第 3 題', practice: '練習', practiceSub: '即時答案', exam: '模擬考試', examSub: '24 題 · 計時',
      wrongNote: '已加入錯題重溫', countdown: '距離考試', days: '日', strategy: '溫習策略 · 基礎程度',
      week: ['一', '二', '三', '四', '五', '六', '日'], tasks: ['溫習 Ch 2 · 15 分鐘', '練習 20 題', '記憶法 3 組'], today: '今日' },
    en: { tabs: ['Chapters', 'Timeline', 'Geo', 'People', 'Memory'], tabIcons: ['📚', '⏳', '🗺️', '👤', '🧠'],
      factQ: 'When was Magna Carta signed?', factA: '1215 — it limited the power of the king', memoLv: 'Memory Lv2',
      qNum: 'Question 3', practice: 'Practice', practiceSub: 'Instant answers', exam: 'Mock exam', examSub: '24 Qs · timed',
      wrongNote: 'Saved to wrong answer review', countdown: 'Test in', days: 'days', strategy: 'Strategy · Basic level',
      week: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], tasks: ['Study Ch 2 · 15 min', 'Practise 20 Qs', '3 memory sets'], today: 'Today' },
  };

  const bookmark = (on = true) => `<span class="bm ${on ? '' : 'off'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${BOOKMARK_PATH}"/></svg></span>`;
  const stars = (d) => `<span class="stars">${'★'.repeat(d)}<span class="off">${'★'.repeat(MAX_DIFFICULTY - d)}</span></span>`;

  function renderLoading(root, { c, logo, randomTip }) {
    root.innerHTML = `<div class="b-load"><img class="b-logo" src="${logo}" alt="">
      <div class="b-name">${c.appTitle}</div><div class="b-sub">${c.appSub}</div>
      <div class="b-dots" role="progressbar" aria-label="${c.loading}"><i></i><i></i><i></i></div>
      <div class="b-note"><b>📌 ${c.tipLabel}</b><span>${randomTip()}</span></div></div>`;
  }

  function artStudy(a) {
    return `<div class="ui">
      <div class="tabs">${a.tabs.map((t, i) => `<span class="${i === 0 ? 'on' : ''}"><i>${a.tabIcons[i]}</i>${t}</span>`).join('')}</div>
      <div class="ui-card float">
        <div class="row"><span class="tag">Ch 1 #12</span>${stars(2)}<span class="sp"></span>${bookmark(true)}</div>
        <div class="fact-q">${a.factQ}</div><div class="fact-a">${a.factA}</div>
        <div class="row"><span class="muted" style="font-size:var(--fs-2xs)">🧠 ${a.memoLv}</span><span class="sp"></span></div>
        <div class="lv"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
      </div></div>`;
  }

  function artPractice(a, d) {
    const letters = ['A', 'B', 'C', 'D'];
    const cls = (k) => (k === d.correctIdx ? 'correct' : k === 0 ? 'wrong' : '');
    return `<div class="ui">
      <div class="ui-card">
        <div class="q-head"><span>${a.qNum}</span>${stars(3)}<span class="sp" style="flex:1"></span>${bookmark(true)}</div>
        <div class="q-text">${d.q}</div>
        ${d.opts.map((o, k) => `<div class="opt ${cls(k)}"><span class="opt-letter">${letters[k]}</span>${o}</div>`).join('')}
        <div style="font-size:var(--fs-2xs);color:var(--red);font-weight:800">✗ ${a.wrongNote}</div>
      </div>
      <div class="modes">
        <div class="mode"><span class="ic">📝</span><div>${a.practice}<small>${a.practiceSub}</small></div></div>
        <div class="mode"><span class="ic">🎯</span><div>${a.exam}<small>${a.examSub}</small><span class="exam-timer" data-timer>⏱ 45:00</span></div></div>
      </div></div>`;
  }

  function artPlan(a, d) {
    const heat = ['h4', 'h3', 'h4', 'h2', 'today', '', ''];
    return `<div class="ui">
      <div class="ui-card">
        <div class="plan-grid">
          <div class="countdown"><span class="muted" style="font-size:var(--fs-2xs)">🗓️ ${a.countdown}</span><br><b>21</b> ${a.days}
            <div class="muted" style="font-size:var(--fs-2xs);margin-top:2px">${a.strategy}</div></div>
          <div class="ring" data-ring><b>0%</b></div>
        </div>
        <div class="week">${a.week.map((w, i) => `<span class="${heat[i]}"><i></i>${heat[i] === 'today' ? a.today : w}</span>`).join('')}</div>
        ${a.tasks.map((t, i) => `<div class="task ${i === 0 ? 'done' : ''}"><i>${i === 0 ? '✓' : ''}</i><span>${t}</span></div>`).join('')}
      </div>
      <div class="ui-card yue float"><span class="badge">粵</span><p>${d.yueQ}<span>${d.yueA}</span></p></div>
    </div>`;
  }

  function cardHtml(p, i, x, a) {
    const last = i === PAGE_COUNT - 1;
    const art = [artStudy(a), artPractice(a, x.c.demo), artPlan(a, x.c.demo)][i];
    return `<article class="b-card p${i + 1}" data-i="${i}">
      <div class="b-art">${art}</div>
      <div class="b-text"><span class="b-kicker">${p.kicker}</span><h2 class="b-title">${p.title}</h2>
        <p class="b-body">${p.body}</p>
        <ul class="b-list">${p.chips.map((ch) => `<li>✓ ${ch}</li>`).join('')}</ul>
        ${last ? Mock.settingsBlock(x.c) : ''}</div></article>`;
  }

  function renderIntro(root, x) {
    const { c, icon } = x;
    const a = ART[x.state.lang];
    const swipeHint = x.state.lang === 'zh' ? '← 左右滑動切換 →' : '← Swipe to move →';
    root.innerHTML = `<div class="b-intro">
      <div class="b-top"><span class="b-step"></span><button class="b-skip" data-b="skip">${c.skip}</button></div>
      <div class="b-stack">${c.pages.map((p, i) => cardHtml(p, i, x, a)).join('')}</div>
      <div class="b-foot">
        <div class="b-pager">
          <button class="nav" data-b="prev" aria-label="${c.back}">${icon('arrowL')}</button>
          <div class="b-dotrow">${c.pages.map((_, i) => `<button data-b="go" data-i="${i}" aria-label="${i + 1}"></button>`).join('')}</div>
          <button class="nav" data-b="next" aria-label="${c.next}">${icon('arrowR')}</button>
        </div>
        <div class="b-swipe">${swipeHint}</div>
        <button class="b-next" data-b="next">${c.next} →</button>
        <div class="b-ctas"><button class="b-alt" data-b="start">${c.start}</button>
          <button class="b-next" data-b="plan">🗓️ ${c.setupPlan}</button></div></div></div>`;
    const go = (n) => { page = Math.max(0, Math.min(PAGE_COUNT - 1, n)); sync(root, x); };
    root.onclick = (e) => {
      const b = e.target.closest('[data-b]');
      if (!b) return;
      const act = b.dataset.b;
      if (act === 'next') go(page + 1);
      if (act === 'prev') go(page - 1);
      if (act === 'go') go(Number(b.dataset.i));
      if (act === 'skip' || act === 'start' || act === 'plan') { page = 0; x.finish(act); }
    };
    Mock.onSwipe(root.querySelector('.b-stack'), (d) => go(page + d));
    Mock.onKeys((d) => go(page + d));
    Mock.bindSettings(root, () => Mock.showIntro());
    animateTabs(root, x);
    animateTimer(root, x);
    sync(root, x);
  }

  // P1: the highlighted study tab walks through the five modes
  function animateTabs(root, x) {
    const tabs = root.querySelectorAll('.tabs span');
    let i = 0;
    const step = () => {
      if (!tabs[0].isConnected) return;
      tabs[i].classList.remove('on');
      i = (i + 1) % tabs.length;
      tabs[i].classList.add('on');
      x.later(step, TAB_CYCLE_MS);
    };
    x.later(step, TAB_CYCLE_MS);
  }

  // P2: the mock-exam chip counts down like .exam-timer
  function animateTimer(root, x) {
    const el = root.querySelector('[data-timer]');
    let left = TIMER_START_S;
    const tick = () => {
      if (!el.isConnected) return;
      left -= 1;
      el.textContent = `⏱ ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
      x.later(tick, SECOND_MS);
    };
    x.later(tick, SECOND_MS);
  }

  // P3: the plan ring fills when the card comes to the front
  function fillRing(root) {
    const ring = root.querySelector('[data-ring]');
    if (!ring || ring.dataset.done) return;
    ring.dataset.done = '1';
    let v = 0;
    const step = () => {
      if (!ring.isConnected || v >= RING_PCT) return;
      v += 1;
      ring.style.setProperty('--p', v);
      ring.querySelector('b').textContent = `${v}%`;
      requestAnimationFrame(step);
    };
    step();
  }

  function sync(root, x) {
    const last = page === PAGE_COUNT - 1;
    root.querySelectorAll('.b-card').forEach((card, i) => {
      const rel = i - page;
      card.dataset.pos = rel < 0 ? 'out' : rel > 2 ? 'hide' : String(rel);
      card.style.zIndex = String(PAGE_COUNT - rel);
      card.setAttribute('aria-hidden', String(rel !== 0));
    });
    root.querySelector('.b-step').textContent = x.fmt(x.c.step, { n: page + 1 });
    root.querySelectorAll('.b-dotrow button').forEach((d, i) => d.setAttribute('aria-current', String(i === page)));
    root.querySelector('.b-pager [data-b="prev"]').disabled = page === 0;
    root.querySelector('.b-pager [data-b="next"]').disabled = last;
    root.querySelector('.b-foot > .b-next').hidden = last;
    root.querySelector('.b-ctas').hidden = !last;
    root.querySelector('.b-skip').style.visibility = last ? 'hidden' : 'visible';
    if (last) x.later(() => fillRing(root), 300);
  }

  Mock.init({
    name: '方案 B · 輕鬆卡片 Friendly（rev 2）',
    renderLoading, renderIntro,
    notes: `
      <div class="note"><h3>rev 2 改動（2026-10-13 feedback）</h3><ul>
        <li>「下一步」上面加返 dots（可撳）+ ‹ › 箭咀，卡片左右 swipe 都得；頂部改做「1 / 3」。</li>
        <li>溫習卡：5 個溫習模式 tab（章節 / 時間線 / 地理 / 人物 / 記憶法，自動輪流 highlight）+ 知識卡有難度星 ★★☆☆☆ 同書籤 flag + 記憶法 Lv。</li>
        <li>練習 / 模擬考試卡：題目卡有「第 3 題」+ 難度星 + flag，4 個選項 A / B / C / D（A 答錯紅、B 正確綠）；下面練習 📝 同模擬考試 🎯 icon，模擬考試有 ⏱ 倒數 timer。</li>
        <li>文字：唔再提 17 份試卷，改提隨機試卷；錯題 →「錯題重溫」。</li>
        <li>溫習計劃卡：距離考試倒數、溫習策略程度、一週完成度熱圖（今日有框）、今日任務 checklist、進度環 0→65%，再加一張廣東話翻譯示範卡。</li>
        <li>文字：「廣東話」→「廣東話翻譯」；「自動編排每日進度」→「製定溫習策略」；CTA「設定溫習計劃」→「製定溫習計劃」。</li></ul></div>
      <div class="note"><h3>沿用</h3><ul>
        <li>淺色 <code>--bg</code> 底 + 疊卡飛走；每頁一個淡色主題（綠 / 藍 / 紫）。</li>
        <li>插畫用 app 真實元件嘅樣式：<code>.stars</code>、bookmark SVG、<code>.opt-letter</code>、<code>.exam-timer</code>、<code>--plan-heat-*</code>。</li>
        <li>電腦：卡片左圖右文（980px），dots 靠左、按鈕靠右，← → 鍵可切換。</li></ul></div>
      <div class="note"><h3>待確認</h3><ul>
        <li>知識卡嘅 flag 喺 app 入面叫「書籤」（溫習），題目嘅叫「標記」（練習）；兩個 icon 一樣。intro 文案跟 app 分開叫，OK？</li>
        <li>dots + 箭咀 + 「左右滑動」提示同時出，會唔會太多？可以淨係留 dots。</li></ul></div>`,
  });
})();
</script>
